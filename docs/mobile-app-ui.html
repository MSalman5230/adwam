<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adwam Almanac Prototype</title>
<meta name="description" content="Interactive Android prototype of Adwam, refined from the 24 Almanac mockups.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&icon_names=add,arrow_back,arrow_forward,bedtime,block,bluetooth,brightness_auto,calendar_month,check,chevron_left,chevron_right,close,code,content_copy,dark_mode,event,expand_more,flag,flashlight_on,format_list_bulleted,history,image,info,light_mode,location_on,lock,menu_book,mosque,my_location,notifications,notifications_active,notifications_off,open_in_new,pause_circle,rainy,remove,restart_alt,schedule,screen_rotation,search,settings,shield,snooze,today,tune,volunteer_activism,wb_twilight,wifi&display=block">
<style>
/* ============ Page chrome (outside the phone) ============ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --sans:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;
  --arabic:'Amiri','Noto Naskh Arabic','Traditional Arabic',serif;
  --pg-bg:#E9E3D6; --pg-ink:#202720; --pg-ink-2:#5B645C; --pg-ink-3:#8A918A; --pg-line:#D6CDBC; --pg-card:#F5F0E6; --pg-card-2:#EFE8DB; --pg-accent:#1E5B47; --pg-accent-soft:#DCE5D4; --pg-gold:#A8823A;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--pg-bg:#0E1210;--pg-ink:#E6E0D2;--pg-ink-2:#A2AAA2;--pg-ink-3:#737B74;--pg-line:#28302B;--pg-card:#151B18;--pg-card-2:#1B231F;--pg-accent:#8FCBB0;--pg-accent-soft:#1F3229;--pg-gold:#D0AC64;}
}
:root[data-theme="dark"]{--pg-bg:#0E1210;--pg-ink:#E6E0D2;--pg-ink-2:#A2AAA2;--pg-ink-3:#737B74;--pg-line:#28302B;--pg-card:#151B18;--pg-card-2:#1B231F;--pg-accent:#8FCBB0;--pg-accent-soft:#1F3229;--pg-gold:#D0AC64;}
html,body{height:100%}
body{background:var(--pg-bg);color:var(--pg-ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:22px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;user-select:none;flex:none;overflow:hidden;width:1em;height:1em}
.ms.fill{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}

.stage{height:100vh;height:100dvh;display:grid;grid-template-columns:300px 1fr 340px;gap:0}
.rail{overflow-y:auto;padding:24px 20px 32px;scrollbar-width:thin;scrollbar-color:var(--pg-line) transparent}
.rail.left{border-right:1px solid var(--pg-line)}
.rail.right{border-left:1px solid var(--pg-line)}
.center{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;padding:16px 0}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:26px;height:26px;color:var(--pg-gold)}
.brand b{font:700 21px/1 var(--serif)}
.rail .lede{margin-top:10px;font-size:14px;line-height:1.45;color:var(--pg-ink-2)}
.rail h4{font:600 11.5px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--pg-gold);margin:26px 0 10px}
.pg-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pg-btn{display:flex;align-items:center;gap:8px;min-height:36px;padding:7px 10px;border-radius:10px;border:1px solid var(--pg-line);background:var(--pg-card);cursor:pointer;font-size:13.5px;text-align:left;line-height:1.2}
.pg-btn:hover{border-color:var(--pg-accent)}
.pg-btn .ms{font-size:18px;color:var(--pg-accent)}
.pg-btn.on{background:var(--pg-accent-soft);border-color:var(--pg-accent)}
.moments{display:flex;flex-direction:column;gap:6px}
.moment{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:12px;border:1px solid var(--pg-line);background:var(--pg-card);cursor:pointer}
.moment b{display:block;font:600 14.5px/1.25 var(--serif)}
.moment span{display:block;font-size:12.5px;color:var(--pg-ink-2);margin-top:2px;line-height:1.3}
.moment:hover{border-color:var(--pg-accent)}
.moment.on{background:var(--pg-accent-soft);border-color:var(--pg-accent)}
.clock{background:var(--pg-card);border:1px solid var(--pg-line);border-radius:14px;padding:12px}
.clock-row{display:flex;align-items:center;gap:6px}
.clock-row .date{flex:1;text-align:center;font:600 14.5px/1.2 var(--serif)}
.clock-row .date small{display:block;font:400 12.5px/1.3 var(--sans);color:var(--pg-ink-2);margin-top:2px}
.pg-icon{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--pg-line);background:transparent;cursor:pointer}
.pg-icon:hover{border-color:var(--pg-accent)}
.pg-icon .ms{font-size:20px}
.clock input[type=range]{width:100%;margin:12px 0 4px;accent-color:var(--pg-accent)}
.clock .time{display:flex;justify-content:space-between;font-size:12.5px;color:var(--pg-ink-2)}
.clock .time b{font:600 15px/1 var(--sans);color:var(--pg-ink)}
.clock .pg-btn{margin-top:10px;width:100%;justify-content:center}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;font-size:14px;border-top:1px solid var(--pg-line)}
.toggle-row:first-of-type{border-top:0}
.pg-switch{width:40px;height:24px;border-radius:12px;background:var(--pg-line);position:relative;border:0;cursor:pointer;flex:none;transition:background .2s}
.pg-switch::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.pg-switch.on{background:var(--pg-accent)}
.pg-switch.on::after{left:19px}
.pg-seg{display:flex;border:1px solid var(--pg-line);border-radius:10px;overflow:hidden}
.pg-seg button{flex:1;height:34px;border:0;background:var(--pg-card);cursor:pointer;font-size:13.5px}
.pg-seg button+button{border-left:1px solid var(--pg-line)}
.pg-seg button.on{background:var(--pg-accent-soft);font-weight:600}
.hint{margin-top:12px;font-size:12.5px;color:var(--pg-ink-3);text-align:center;line-height:1.4}
.hint kbd{font:600 11px/1 var(--sans);border:1px solid var(--pg-line);border-radius:4px;padding:2px 5px;background:var(--pg-card)}

/* review rail */
.rv-intro{font-size:14px;line-height:1.5;color:var(--pg-ink-2)}
.rv-list{list-style:none;display:flex;flex-direction:column;gap:8px}
.rv-list li{font-size:13.5px;line-height:1.45;padding-left:14px;position:relative;color:var(--pg-ink)}
.rv-list li::before{content:'';position:absolute;left:2px;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--pg-gold)}
.rv-list b{font-weight:600}
.rv-screen{border:1px solid var(--pg-line);background:var(--pg-card);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.rv-screen .h{display:flex;align-items:baseline;gap:8px}
.rv-screen .n{font:600 11.5px/1 var(--sans);color:var(--pg-gold);letter-spacing:.04em;flex:none}
.rv-screen .t{font:600 14px/1.25 var(--serif);flex:1}
.rv-screen p{font-size:13px;line-height:1.45;color:var(--pg-ink-2);margin-top:5px}
.rv-screen p b{color:var(--pg-ink);font-weight:600}
.rv-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.rv-actions button{height:28px;padding:0 10px;border-radius:14px;border:1px solid var(--pg-line);background:transparent;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.rv-actions button .ms{font-size:15px}
.rv-actions button:hover{border-color:var(--pg-accent);color:var(--pg-accent)}
.rv-tag{font:600 10.5px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;padding:3px 6px;border-radius:5px;background:var(--pg-accent-soft);color:var(--pg-accent);flex:none}
.rail-toggle{display:none}
.lightbox{position:fixed;inset:0;background:rgba(10,12,11,.82);display:flex;align-items:center;justify-content:center;z-index:100;padding:24px;cursor:zoom-out}
.lightbox img{max-height:100%;max-width:100%;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.5);background:#eee}
.lightbox .cap{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#eee;font-size:13px}

/* phone */
.phone-wrap{position:relative;flex:none}
.phone{width:436px;height:939px;border-radius:54px;background:linear-gradient(145deg,#2a2d2b,#121413 60%);padding:12px;position:absolute;top:0;left:0;transform-origin:0 0;box-shadow:inset 0 0 0 1.5px #3c403d,inset 0 0 0 4px #161817,0 40px 80px -30px rgba(40,30,10,.45),0 12px 30px -12px rgba(40,30,10,.35)}
.phone::before{content:'';position:absolute;right:-3px;top:180px;width:3px;height:64px;border-radius:0 2px 2px 0;background:#2a2d2b}
.phone::after{content:'';position:absolute;right:-3px;top:270px;width:3px;height:110px;border-radius:0 2px 2px 0;background:#2a2d2b}
.camera{position:absolute;top:13px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#090a0a;z-index:90;box-shadow:inset 0 0 0 2px #1b1d1c}

/* ============ App design tokens ============ */
.screen{
  --paper:#F6F1E7; --paper-2:#EFE8DA; --surface:#FFFDF8; --hair:#E3DACB; --hair-2:#D3C8B3;
  --ink:#1F2A24; --ink-2:#56615A; --ink-3:#88908A; --paper-caption:var(--ink-2);
  --green:#1E5B47; --on-green:#FFFFFF; --sage:#E1E8D7; --on-sage:#174536; --rule:rgba(30,91,71,.32);
  --gold:#B08A3E; --gold-text:#77591F; --gold-line:rgba(176,138,62,.75); --gold-soft:#F3EAD6;
  --rust:#9A4A2E; --rust-soft:#F6E5DC;
  --scrim:rgba(24,28,26,.42); --inverse:#2B3430; --on-inverse:#F2EDE2; --inverse-accent:#A9D7C1;
  --sys:#F4EFE6; --sys-2:#E9E2D5; --shade:#1E2723;
  width:412px;height:915px;border-radius:42px;overflow:hidden;position:relative;background:var(--paper);color:var(--ink);font-family:var(--sans);display:flex;flex-direction:column;isolation:isolate;
}
.screen[data-mode="dark"]{
  --paper:#121815; --paper-2:#0E1311; --surface:#1A221E; --hair:#2A3430; --hair-2:#3A4640;
  --ink:#ECE5D6; --ink-2:#AEB5AC; --ink-3:#7D867F; --paper-caption:var(--ink-3);
  --green:#8FCBB0; --on-green:#0D2A20; --sage:#21382E; --on-sage:#C3E5D4; --rule:rgba(143,203,176,.3);
  --gold:#D3AF67; --gold-text:var(--gold); --gold-line:rgba(211,175,103,.6); --gold-soft:#2D2717;
  --rust:#E49C80; --rust-soft:#3A241C;
  --scrim:rgba(0,0,0,.55); --inverse:#E9E2D3; --on-inverse:#1A221E; --inverse-accent:#1E5B47;
  --sys:#222B27; --sys-2:#2C3631; --shade:#0B0F0D;
}
.screen *{-webkit-tap-highlight-color:transparent}
.statusbar{height:40px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 26px 0 30px;font:500 14.5px/1 var(--sans);color:var(--ink);z-index:40;cursor:pointer;position:relative;background:var(--paper)}
.statusbar .sb-icons{display:flex;align-items:center;gap:6px}
.statusbar svg{display:block}
.viewport{flex:1;position:relative;overflow:hidden;min-height:0}
.gesture{height:24px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--paper)}
.gesture span{width:110px;height:4px;border-radius:2px;background:var(--ink);opacity:.8}
.with-nav .gesture{background:var(--paper-2)}

/* typography */
.serif{font-family:var(--serif)}
.over{font:600 11.5px/1.2 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--gold-text)}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.tr{font-family:var(--serif);font-style:italic}
.ar{font-family:var(--arabic);direction:rtl;text-align:right;font-size:27px;line-height:1.9;color:var(--ink)}

/* pages */
.page{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--paper)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:0 20px 32px;overscroll-behavior:contain;min-height:0}
.scroll::-webkit-scrollbar{display:none}
.anim-push{animation:pushIn .32s cubic-bezier(.2,.8,.2,1)}
.anim-pop{animation:popIn .28s cubic-bezier(.2,.8,.2,1)}
.anim-fade{animation:fadeIn .24s ease-out}
@keyframes pushIn{from{transform:translateX(34px);opacity:0}to{transform:none;opacity:1}}
@keyframes popIn{from{transform:translateX(-24px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.appbar{flex:none;height:60px;display:flex;align-items:center;gap:4px;padding:0 10px 0 6px;position:relative;z-index:5;background:var(--paper);transition:box-shadow .2s}
.page.scrolled .appbar{box-shadow:0 1px 0 var(--hair)}
.appbar .ab-title{flex:1;min-width:0;font:650 19px/1.2 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transform:translateY(5px);transition:opacity .2s,transform .2s}
.appbar .ab-title.static,.page.scrolled .appbar .ab-title{opacity:1;transform:none}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:0;background:none;color:var(--ink);cursor:pointer;flex:none}
.iconbtn:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.iconbtn .ms{font-size:24px}

/* large header on tab roots */
.hero{padding:18px 0 16px;border-bottom:1px solid var(--gold-line)}
.hero h1{font:700 34px/1.08 var(--serif);letter-spacing:-.012em;text-wrap:balance}
.hero h1.page-title{font-size:32px}
.hero .sub{margin-top:7px;font:400 15.5px/1.35 var(--sans);color:var(--ink-2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.hero .sub .ms{font-size:17px;color:var(--gold)}
.pill-tag{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:12px;background:var(--gold-soft);color:var(--gold-text);font:600 12px/1 var(--sans)}
.dark-gold{color:var(--gold-text)}

/* sub-page title block */
.ptitle{padding:2px 0 16px;border-bottom:1px solid var(--gold-line)}
.ptitle .over{margin-bottom:8px}
.ptitle h1{font:700 28px/1.14 var(--serif);letter-spacing:-.01em;text-wrap:balance}
.ptitle .sub{margin-top:8px;font:400 15px/1.4 var(--sans);color:var(--ink-2)}

/* section header */
.sec{display:flex;align-items:center;gap:12px;margin:24px 0 10px}
.sec h2{font:650 19px/1.2 var(--serif);color:var(--green);white-space:nowrap}
.sec .rule{flex:1;height:1px;background:var(--rule)}
.sec .aside{font:500 13px/1 var(--sans);color:var(--paper-caption);white-space:nowrap}
.glabel{font:600 11.5px/1.2 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--gold-text);margin:24px 4px 8px}

/* day line */
.dayline{margin-top:16px;padding:0 2px}
.dl-track{position:relative;height:14px;margin:0 22px}
.dl-base{position:absolute;left:0;right:0;top:6px;height:2px;border-radius:1px;background:var(--hair-2)}
.dl-fill{position:absolute;left:0;top:6px;height:2px;border-radius:1px;background:var(--green);transition:width .3s}
.dl-m{position:absolute;top:3px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--paper);border:2px solid var(--hair-2)}
.dl-m.past{background:var(--green);border-color:var(--green)}
.dl-m.mg{width:10px;height:10px;margin-left:-5px;top:2px;border-radius:2px;transform:rotate(45deg);border-color:var(--gold);background:var(--paper)}
.dl-m.mg.past{background:var(--gold);border-color:var(--gold)}
.dl-now{position:absolute;top:0;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px color-mix(in srgb,var(--green) 22%,transparent);transition:left .3s}
.dl-labels{display:grid;grid-template-columns:repeat(5,1fr);margin-top:6px;text-align:center}
.dl-labels div{font:500 12.5px/1.25 var(--sans);color:var(--ink)}
.dl-labels div span{display:block;font-weight:400;font-size:12px;color:var(--paper-caption)}
.dl-labels div.mg{color:var(--gold-text)}
.dl-cap{margin-top:10px;font:400 13.5px/1.35 var(--sans);color:var(--ink-2);display:flex;align-items:center;gap:6px}
.dl-cap .ms{font-size:17px;color:var(--gold)}

/* banner */
.banner{margin-top:16px;display:flex;align-items:center;gap:12px;padding:12px 10px 12px 14px;border-radius:16px;background:var(--sage);cursor:pointer}
.banner svg.crescent{width:24px;height:24px;color:var(--gold);flex:none;align-self:flex-start;margin-top:1px}
.banner .tx{flex:1;min-width:0}
.banner .t{font:650 16.5px/1.25 var(--serif);color:var(--on-sage)}
.banner .s{font:400 14px/1.35 var(--sans);color:color-mix(in srgb,var(--on-sage) 80%,var(--ink-2));margin-top:2px}
.banner .ms{color:var(--on-sage);opacity:.7}

/* notices */
.notice{margin-top:12px;display:flex;gap:12px;padding:14px 14px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--hair)}
.notice .ic{width:36px;height:36px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;flex:none}
.notice .ic .ms{font-size:20px}
.notice .ic svg{width:20px;height:20px}
.notice .tx{flex:1;min-width:0}
.notice .t{font:650 16px/1.25 var(--serif)}
.notice .s{font:400 14px/1.4 var(--sans);color:var(--ink-2);margin-top:3px}
.notice .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.notice .x{margin:-8px -6px 0 0;width:36px;height:36px}
.notice .x .ms{font-size:20px;color:var(--ink-3)}

/* cards */
.card{background:var(--surface);border:1px solid var(--hair);border-radius:16px;padding:14px 16px 14px;position:relative;cursor:pointer;transition:background .2s,opacity .2s,border-color .2s}
.card+.card{margin-top:10px}
.card:hover{border-color:var(--hair-2)}
.card .row1{display:flex;align-items:flex-start;gap:10px}
.card .row1 .lead{width:26px;height:26px;flex:none;color:var(--gold);display:grid;place-items:center;margin:-1px -2px 0 -2px}
.card .row1 .lead .ms{font-size:24px}
.card h3{font:650 17px/1.28 var(--serif);flex:1;min-width:0;text-wrap:balance}
.meta{display:inline-flex;align-items:center;gap:4px;font:500 13px/1.2 var(--sans);color:var(--ink-2);white-space:nowrap;padding-top:3px;flex:none}
.meta .ms{font-size:16px;color:var(--gold)}
.card p{font:400 14.5px/1.42 var(--sans);color:var(--ink-2);margin-top:4px}
.card p.also{font-size:13.5px;color:var(--gold-text);margin-top:3px}
.card .inline-dua{margin-top:6px;font:italic 400 15.5px/1.35 var(--serif);color:var(--ink)}
.card .credit{display:inline-block;margin-top:6px;font:400 13px/1.3 var(--sans);color:var(--green);text-decoration:underline;text-underline-offset:2px}
.card .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0 -8px;border-top:1px solid var(--hair);padding-top:2px}
.card .foot.nob{border-top:0;margin-top:4px}
.card.done{background:color-mix(in srgb,var(--sage) 50%,var(--surface));border-color:transparent}
.card.done h3{color:var(--ink-2)}
.card.fasting{background:color-mix(in srgb,var(--sage) 55%,var(--surface));border-color:transparent}
.card.moved{animation:settle .45s cubic-bezier(.2,.8,.2,1)}
@keyframes settle{from{transform:translateY(-14px);opacity:.3}to{transform:none;opacity:1}}
.check{display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 6px 0 2px;margin-left:-2px;font:500 14.5px/1 var(--sans);color:var(--ink);cursor:pointer;border:0;background:none;border-radius:8px}
.box{width:20px;height:20px;border-radius:5px;border:2px solid var(--ink-2);display:grid;place-items:center;transition:background .15s,border-color .15s;flex:none}
.box .ms{font-size:17px;color:var(--on-green);opacity:0;font-variation-settings:'FILL' 0,'wght' 600,'GRAD' 0,'opsz' 20}
.check.on .box{background:var(--green);border-color:var(--green)}
.check.on .box .ms{opacity:1}
.tracker{display:flex;align-items:center;gap:10px;margin-top:10px;font:500 13.5px/1.2 var(--sans);color:var(--ink-2)}
.dots{display:flex;gap:6px}
.dot{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--gold);transition:background .2s,border-color .2s}
.dot.on{background:var(--green);border-color:var(--green)}
.dot.today{box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 22%,transparent)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--hair-2);border-radius:20px;height:36px}
.stepper button{width:40px;height:34px;border:0;background:none;cursor:pointer;display:grid;place-items:center;color:var(--green)}
.stepper button .ms{font-size:20px}
.stepper b{min-width:28px;text-align:center;font:600 16px/1 var(--sans)}

.empty{border:1px dashed var(--hair-2);border-radius:16px;padding:16px;display:flex;gap:12px;align-items:flex-start}
.empty .ms{color:var(--gold);font-size:24px}
.empty .t{font:650 16.5px/1.25 var(--serif)}
.empty .s{font:400 14px/1.4 var(--sans);color:var(--ink-2);margin-top:3px}

/* lists */
.list{background:var(--surface);border:1px solid var(--hair);border-radius:16px;overflow:hidden}
.li{display:flex;align-items:center;gap:14px;padding:12px 14px 12px 16px;min-height:60px;border-top:1px solid var(--hair);cursor:pointer;position:relative}
.li:first-child{border-top:0}
.li:hover{background:color-mix(in srgb,var(--ink) 3%,transparent)}
.li .lic{width:24px;color:var(--ink-2);flex:none;display:grid;place-items:center}
.li .tx{flex:1;min-width:0}
.li .t{font:650 16px/1.25 var(--serif)}
.li .t.sans{font:500 16px/1.25 var(--sans)}
.li .s{font:400 13.5px/1.35 var(--sans);color:var(--ink-2);margin-top:2px}
.li .end{display:flex;align-items:center;gap:6px;color:var(--ink-3);flex:none}
.li .end .bell{font-size:18px;color:var(--gold)}
.li .chev{font-size:22px;color:var(--ink-3)}
.linkrow{display:flex;justify-content:flex-end;margin-top:6px}

/* buttons */
.btn{height:48px;border-radius:24px;padding:0 22px;font:600 15.5px/1 var(--sans);display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;width:100%;transition:filter .15s,background .15s}
.btn .ms{font-size:20px}
.btn.filled{background:var(--green);color:var(--on-green)}
.btn.filled:hover{filter:brightness(1.08)}
.btn.outlined{background:transparent;border:1px solid var(--hair-2);color:var(--green)}
.btn.outlined:hover{background:color-mix(in srgb,var(--green) 6%,transparent)}
.btn.tonal{background:var(--sage);color:var(--on-sage)}
.btn.text{background:none;color:var(--green);width:auto;padding:0 12px;height:40px}
.btn.text:hover{background:color-mix(in srgb,var(--green) 8%,transparent)}
.btn.sm{height:36px;border-radius:18px;padding:0 16px;font-size:14px;width:auto}
.btn.sm .ms{font-size:18px}
.btn[disabled]{opacity:.45;pointer-events:none}
.bottom-actions{flex:none;padding:12px 20px 14px;display:flex;flex-direction:column;gap:10px;background:var(--paper)}

/* segmented */
.seg{display:flex;border:1px solid var(--hair-2);border-radius:20px;overflow:hidden;height:40px;background:var(--surface)}
.seg button{flex:1;border:0;background:transparent;font:500 14px/1 var(--sans);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;min-width:0;transition:background .15s}
.seg button+button{border-left:1px solid var(--hair-2)}
.seg button.on{background:var(--sage);color:var(--on-sage);font-weight:600}
.seg button .ms{font-size:18px}
.seg.sm{height:36px}
.seg.sm button{font-size:13.5px}

/* switch (M3) */
.switch{width:52px;height:32px;border-radius:16px;background:var(--hair);border:2px solid var(--ink-3);position:relative;flex:none;cursor:pointer;transition:background .2s,border-color .2s;padding:0}
.switch::after{content:'';position:absolute;top:50%;left:6px;width:16px;height:16px;border-radius:50%;background:var(--ink-3);transform:translateY(-50%);transition:all .2s}
.switch.on{background:var(--green);border-color:var(--green)}
.switch.on::after{left:22px;width:24px;height:24px;background:var(--on-green)}

/* chips */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:34px;border-radius:10px;border:1px solid var(--hair-2);padding:0 14px;display:inline-flex;align-items:center;gap:6px;font:500 14px/1 var(--sans);background:transparent;color:var(--ink);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--sage);border-color:transparent;color:var(--on-sage);padding-left:9px}
.chip .ms{font-size:18px}
.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:6px;font:600 11.5px/1 var(--sans);letter-spacing:.02em}
.tag.nofast{background:var(--rust-soft);color:var(--rust)}
.tag.paused{background:var(--gold-soft);color:var(--gold-text)}
.tag .ms{font-size:14px}
.tag.paused .ms{color:var(--gold)}

/* status chip on details */
.status{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font:600 13.5px/1.2 var(--sans);padding:7px 12px 7px 10px;border-radius:10px}
.status i{width:8px;height:8px;border-radius:50%;background:currentColor}
.status.active{background:var(--sage);color:var(--on-sage)}
.status.soon{background:var(--gold-soft);color:var(--gold-text)}
.status.soon i{background:var(--gold)}
.status.past{background:color-mix(in srgb,var(--ink) 7%,transparent);color:var(--ink-2)}
.whenline{display:flex;gap:8px;align-items:flex-start;margin-top:12px;font:400 14.5px/1.4 var(--sans);color:var(--ink-2)}
.whenline .ms{font-size:18px;color:var(--gold);margin-top:1px}
.body{font:400 15.5px/1.5 var(--sans);color:var(--ink)}
.body+.body{margin-top:8px}
.note{margin-top:12px;padding:2px 0 2px 14px;border-left:2px solid var(--gold);font:400 14.5px/1.5 var(--sans);color:var(--ink-2)}
.note+.note{margin-top:8px}
.dua{background:var(--surface);border:1px solid var(--hair);border-radius:16px;padding:14px 16px 12px}
.dua .tr{font-size:17px;line-height:1.4;margin-top:4px}
.dua .en{font:400 15px/1.45 var(--sans);color:var(--ink-2);margin-top:6px}
.dua .acts{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.srcs{display:flex;flex-direction:column;margin-top:4px}
.src{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:46px;border-top:1px solid var(--hair);font:500 15px/1.3 var(--sans);color:var(--green);text-decoration:none}
.src:first-child{border-top:0}
.src .ms{font-size:18px;color:var(--ink-3)}
.src:hover span:first-child{text-decoration:underline;text-underline-offset:3px}
.evidence{border-top:1px solid var(--hair)}
.evidence:first-child{border-top:0}
.evidence>.src{cursor:pointer;list-style:none}
.evidence>.src::-webkit-details-marker{display:none}
.evidence[open]>summary .ms{transform:rotate(180deg)}
.evidence .grade{display:block;color:var(--paper-caption);font-size:12px;margin-top:4px}
.evidence .excerpt{padding:0 0 12px}
.cap{font:400 13.5px/1.45 var(--sans);color:var(--ink-2);margin-top:10px}
.foot-links{margin-top:28px;padding-top:6px;border-top:1px solid var(--hair);display:flex;flex-direction:column;gap:2px}
.foot-links .btn.text{justify-content:flex-start;padding:0 8px;margin-left:-8px}
.foot-links .fine{font:400 12.5px/1.4 var(--sans);color:var(--paper-caption);padding:4px 0}

/* upcoming agenda */
.filters{margin-top:14px}
.week{margin-top:4px}
.agenda{background:var(--surface);border:1px solid var(--hair);border-radius:16px;overflow:hidden}
.ag-day{display:flex;border-top:1px solid var(--hair)}
.ag-day:first-child{border-top:0}
.ag-date{width:58px;flex:none;padding:12px 0 10px;text-align:center;border-right:1px solid var(--hair)}
.ag-date .wd{font:600 11px/1 var(--sans);letter-spacing:.08em;color:var(--ink-2);text-transform:uppercase}
.ag-date .dn{font:650 22px/1.1 var(--serif);margin-top:4px}
.ag-date.today .dn{color:var(--green)}
.ag-date.today .wd{color:var(--green)}
.ag-items{flex:1;min-width:0}
.ag-item{display:flex;align-items:center;gap:10px;padding:11px 14px 11px 14px;cursor:pointer;min-height:58px}
.ag-item+.ag-item{border-top:1px solid var(--hair)}
.ag-item:hover{background:color-mix(in srgb,var(--ink) 3%,transparent)}
.ag-item .tx{flex:1;min-width:0}
.ag-item .t{font:650 15.5px/1.25 var(--serif)}
.ag-item .s{font:400 13px/1.35 var(--sans);color:var(--ink-2);margin-top:2px}
.ag-item .bell{font-size:18px;color:var(--gold)}
.ag-item .tags{display:flex;gap:6px;margin-top:5px}
.ag-month{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--sage);color:var(--on-sage);border-top:1px solid var(--hair)}
.ag-month:first-child{border-top:0}
.ag-month svg{width:20px;height:20px;color:var(--gold);flex:none}
.ag-month .t{font:650 15px/1.2 var(--serif)}
.ag-month .s{font:400 12.5px/1.3 var(--sans);opacity:.8;margin-top:1px}
.legend{display:flex;flex-direction:column;gap:8px;margin-top:22px;padding-top:14px;border-top:1px solid var(--hair);font:400 13px/1.4 var(--sans);color:var(--ink-2)}
.legend div{display:flex;align-items:center;gap:8px}
.legend .ms{font-size:17px;color:var(--gold)}

/* settings & reminders */
.summary{margin-top:16px;background:var(--surface);border:1px solid var(--hair);border-radius:16px;padding:16px}
.summary .big{font:700 22px/1.2 var(--serif);margin-top:6px}
.summary .s{font:400 14px/1.4 var(--sans);color:var(--ink-2);margin-top:4px}
.summary .seg{margin-top:14px}
.summary .custom{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.grp{background:var(--surface);border:1px solid var(--hair);border-radius:16px;overflow:hidden;margin-top:10px}
.grp-h{display:flex;align-items:center;gap:12px;padding:12px 14px 12px 16px;min-height:64px;cursor:pointer}
.grp-h .tx{flex:1;min-width:0}
.grp-h .t{font:650 17px/1.25 var(--serif)}
.grp-h .s{font:400 13.5px/1.35 var(--sans);color:var(--ink-2);margin-top:2px}
.grp-h .chev{color:var(--ink-3);transition:transform .2s}
.grp.open .grp-h .chev{transform:rotate(180deg)}
.grp-b{border-top:1px solid var(--hair);padding:4px 16px 14px}
.grp.off .grp-b{opacity:.5;pointer-events:none}
.ri{padding:12px 0 2px}
.ri+.ri{border-top:1px solid var(--hair);margin-top:12px}
.ri .t{font:650 15.5px/1.3 var(--serif);display:flex;align-items:center;gap:8px;cursor:pointer}
.ri .t .ms{font-size:18px;color:var(--ink-3)}
.ri .s{font:400 13px/1.4 var(--sans);color:var(--ink-2);margin:2px 0 0}
.ri .seg{margin-top:10px}
.ri-month{font:600 11.5px/1.2 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--gold-text);margin:18px 0 0}
.ri-month+.ri{border-top:0;margin-top:0}
.pause{margin-top:10px;background:var(--surface);border:1px solid var(--hair);border-radius:16px;padding:14px 14px 14px 16px}
.pause .top{display:flex;align-items:center;gap:12px}
.pause .top .tx{flex:1}
.pause .t{font:650 17px/1.25 var(--serif)}
.pause .s{font:400 13.5px/1.35 var(--sans);color:var(--ink-2);margin-top:2px}
.pause .chips{margin-top:12px}
.prayers{margin-top:10px;background:var(--surface);border:1px solid var(--hair);border-radius:16px;padding:4px 16px 14px}
.prayers .t{min-height:48px;display:flex;align-items:center;gap:8px;font:650 17px/1.25 var(--serif);cursor:pointer}
.prayers .t .ms{font-size:18px;color:var(--ink-3)}
.prayers .s{font:400 13.5px/1.35 var(--sans);color:var(--ink-2)}
.prayers .seg{margin-top:10px}

/* about */
.about-hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:12px 0 22px;border-bottom:1px solid var(--gold-line)}
.app-icon{width:72px;height:72px;border-radius:22px;background:var(--green);display:grid;place-items:center;color:#D9B66E}
.app-icon svg{width:38px;height:38px}
.about-hero h1{font:700 28px/1.1 var(--serif);margin-top:14px}
.about-hero p{font:400 15px/1.4 var(--sans);color:var(--ink-2);margin-top:4px}
.about-hero .ver{margin-top:12px}
.prose{font:400 15px/1.5 var(--sans);color:var(--ink)}

/* setup */
.setup-top{flex:none;display:flex;align-items:center;gap:6px;height:60px;padding:0 20px 0 6px}
.setup-top .brandmark{display:flex;align-items:center;gap:8px;padding-left:14px;font:650 18px/1 var(--serif)}
.setup-top .brandmark svg{width:20px;height:20px;color:var(--gold)}
.progress{display:flex;gap:6px;flex:1;justify-content:flex-end}
.progress i{width:28px;height:4px;border-radius:2px;background:var(--hair-2)}
.progress i.on{background:var(--green)}
.setup-h{font:700 28px/1.15 var(--serif);letter-spacing:-.01em;margin-top:14px;text-wrap:balance}
.setup-p{font:400 16px/1.45 var(--sans);color:var(--ink-2);margin-top:10px}
.promise{margin-top:26px;display:flex;flex-direction:column;gap:0;background:var(--surface);border:1px solid var(--hair);border-radius:16px;padding:4px 16px}
.promise div{display:flex;gap:14px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--hair);font:400 14.5px/1.4 var(--sans);color:var(--ink)}
.promise div:first-child{border-top:0}
.promise .ms{color:var(--gold);font-size:22px}
.promise b{font-weight:600;display:block}
.promise span.d{color:var(--ink-2)}
.big-date{font:700 36px/1.1 var(--serif);color:var(--green);margin-top:6px;letter-spacing:-.01em;text-wrap:balance;transition:opacity .15s}
.radio-card{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:16px;border:1px solid var(--hair);background:var(--surface);cursor:pointer;margin-top:10px;transition:background .15s,border-color .15s}
.radio-card.on{background:var(--sage);border-color:transparent}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--ink-2);flex:none;margin-top:2px;display:grid;place-items:center}
.radio-card.on .radio,.opt.on .radio{border-color:var(--green)}
.radio-card.on .radio::after,.opt.on .radio::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--green)}
.radio-card .t{font:650 17.5px/1.25 var(--serif)}
.radio-card.on .t{color:var(--on-sage)}
.radio-card .s{font:400 14.5px/1.4 var(--sans);color:var(--ink-2);margin-top:3px}
.radio-card .k{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font:600 13px/1 var(--sans);color:var(--gold-text)}
.radio-card .k .ms{font-size:16px;color:var(--gold)}
.welcome{display:flex;align-items:center;gap:14px;padding:8px 0 20px;border-bottom:1px solid var(--gold-line)}
.welcome .app-icon{width:56px;height:56px;border-radius:18px;flex:none}
.welcome .app-icon svg{width:30px;height:30px}
.welcome .wm{font:700 24px/1.1 var(--serif)}
.welcome .tg{font:400 14.5px/1.4 var(--sans);color:var(--ink-2);margin-top:3px}
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);margin-top:18px;background:var(--surface);border:1px solid var(--hair);border-radius:16px;padding:6px}
.weekstrip div{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:11px}
.weekstrip div.on{background:var(--sage)}
.weekstrip .w{font:600 10.5px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.weekstrip .g{font:650 18px/1.1 var(--serif)}
.weekstrip .hj{font:600 13px/1 var(--sans);color:var(--green)}
.weekstrip .hj small{font-size:10px;font-weight:600;display:block;text-align:center;margin-top:2px;color:var(--gold-text);letter-spacing:.02em}
.ws-cap{display:flex;justify-content:space-between;font:400 12.5px/1.3 var(--sans);color:var(--paper-caption);margin:8px 4px 0}
.nw{white-space:nowrap}
.saw{font-family:var(--arabic);font-size:1.2em;line-height:0;font-style:normal}
.notif-preview{margin-top:24px;padding:14px;border-radius:20px;background:var(--sys);border:1px solid var(--hair)}
.notif-preview .lbl{font:600 11.5px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);margin:2px 2px 10px}

/* overlays */
.ov{position:absolute;inset:0;z-index:50;pointer-events:none}
.ov>*{pointer-events:auto}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .25s}
.ov.open .scrim{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-radius:28px 28px 0 0;padding:8px 20px 28px;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);max-height:88%;overflow-y:auto;scrollbar-width:none;box-shadow:0 -10px 30px rgba(0,0,0,.12)}
.sheet::-webkit-scrollbar{display:none}
.ov.open .sheet{transform:none}
.sheet .handle{width:32px;height:4px;border-radius:2px;background:var(--ink-3);opacity:.45;margin:6px auto 16px}
.sheet h2{font:700 22px/1.2 var(--serif)}
.sheet .lead{font:400 14.5px/1.45 var(--sans);color:var(--ink-2);margin-top:6px}
.sheet .sec{margin-top:20px}
.opt{display:flex;gap:14px;align-items:center;min-height:52px;padding:8px 2px;border-top:1px solid var(--hair);cursor:pointer}
.opt:first-child{border-top:0}
.opt .tx{flex:1}
.opt .t{font:500 15.5px/1.3 var(--sans)}
.opt .s{font:400 13px/1.35 var(--sans);color:var(--ink-2);margin-top:2px}
.opt .ms.ok{color:var(--green)}
.opts{margin-top:10px;background:var(--surface);border:1px solid var(--hair);border-radius:16px;padding:0 14px}
.search{display:flex;align-items:center;gap:10px;height:52px;border-radius:26px;background:var(--surface);border:1px solid var(--hair-2);padding:0 16px;margin-top:14px}
.search input{flex:1;border:0;background:none;font:400 16px/1 var(--sans);color:var(--ink);outline:none;min-width:0}
.search .ms{color:var(--ink-2)}
.search input::placeholder,.field::placeholder{color:var(--ink-2);opacity:1}
.field{width:100%;min-height:110px;border-radius:12px;border:1px solid var(--hair-2);background:var(--surface);padding:12px 14px;font:400 15px/1.45 var(--sans);color:var(--ink);resize:none;outline:none;margin-top:12px}
.field:focus,.search:focus-within{border-color:var(--green)}
.kv{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.kv span{font:500 12.5px/1 var(--sans);padding:6px 9px;border-radius:8px;background:var(--paper-2);color:var(--ink-2)}
.sheet .btn.filled{margin-top:18px}
.timepick{display:flex;align-items:center;gap:10px;margin-top:10px}
.timepick label{flex:1;display:flex;flex-direction:column;gap:6px;font:500 13px/1 var(--sans);color:var(--ink-2)}
.timepick select{height:48px;border-radius:12px;border:1px solid var(--hair-2);background:var(--surface);color:var(--ink);font:500 16px/1 var(--sans);padding:0 12px;outline:none}
.preview-line{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--sage);color:var(--on-sage);font:400 14.5px/1.4 var(--sans)}
.preview-line b{font:650 16px/1.3 var(--serif);display:block}

/* system dialog */
.sysdlg{position:absolute;left:26px;right:26px;top:50%;background:var(--sys);border-radius:28px;padding:24px 20px 18px;transform:translateY(-50%) scale(.94);opacity:0;transition:transform .22s cubic-bezier(.2,.8,.2,1),opacity .2s;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.ov.open .sysdlg{transform:translateY(-50%);opacity:1}
.sysdlg .sic{color:var(--green);display:grid;place-items:center;margin-bottom:12px}
.sysdlg .sic .ms{font-size:28px}
.sysdlg .sic svg{width:30px;height:30px}
.sysdlg h3{font:400 21px/1.3 var(--sans);color:var(--ink)}
.sysdlg h3 b{font-weight:600}

<script>
'use strict';
/* =========================================================
   Basics
   ========================================================= */
const MIN = 60000, HOUR = 3600000, DAY = 86400000;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* headings: never break a hyphenated name such as al-Ākhirah */
const nw = s => esc(s).replace(/(\S*-\S*)/g, '<span class="nw">$1</span>');

const CRESCENT = (c = '') => `<svg class="crescent ${c}" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="13" r="8.6" fill="currentColor" mask="url(#crescent-mask)"/></svg>`;

const WD = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const WDS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON = ['January','February','March','April','May','June','July','August','September','October','November','December'];

const SACRED = [1, 7, 11, 12];
const CONTENT_VERSION = '2026.11.27';
const CURRENT_YEAR = 2026;

const isoParts = iso => iso.split('-').map(Number);
const isoAdd = (iso, n) => { const [y, m, d] = isoParts(iso); return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10); };
const wdOf = iso => { const [y, m, d] = isoParts(iso); return new Date(Date.UTC(y, m - 1, d)).getUTCDay(); };
const dayDiff = (a, b) => { const [y1, m1, d1] = isoParts(a), [y2, m2, d2] = isoParts(b); return Math.round((Date.UTC(y1, m1 - 1, d1) - Date.UTC(y2, m2 - 1, d2)) / DAY); };
const toMin = hm => { const [h, m] = hm.split(':').map(Number); return h * 60 + m; };
const ordinal = n => n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th','st','nd','rd'][n % 10] || 'th');

/* =========================================================
   Places and prayer-time methods
   ========================================================= */
const CITIES = {
  london:      {name:'London', country:'United Kingdom', lat:51.5074, lng:-0.1278, tz:'Europe/London', method:'mwl'},
  birmingham:  {name:'Birmingham', country:'United Kingdom', lat:52.4862, lng:-1.8904, tz:'Europe/London', method:'mwl'},

/* Prayer times: standard solar-position method (as in PrayTimes / adhan) */
const PT = (() => {
  const r = Math.PI / 180, dg = 180 / Math.PI;
  const sin = d => Math.sin(d * r), cos = d => Math.cos(d * r), tan = d => Math.tan(d * r);
  const asin = x => Math.asin(x) * dg, acos = x => Math.acos(x) * dg, atan2 = (y, x) => Math.atan2(y, x) * dg, acot = x => Math.atan(1 / x) * dg;
  const fix = (a, b) => { a = a - b * Math.floor(a / b); return a < 0 ? a + b : a; };
  const julian = (y, m, d) => { if (m <= 2) { y -= 1; m += 12; } const A = Math.floor(y / 100), B = 2 - A + Math.floor(A / 4); return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524.5; };
  const sunPos = jd => { const D = jd - 2451545; const g = fix(357.529 + 0.98560028 * D, 360), q = fix(280.459 + 0.98564736 * D, 360); const L = fix(q + 1.915 * sin(g) + 0.020 * sin(2 * g), 360); const e = 23.439 - 0.00000036 * D; const RA = atan2(cos(e) * sin(L), cos(L)) / 15; return {decl: asin(sin(e) * sin(L)), eqt: q / 15 - fix(RA, 24)}; };
  function compute(y, m, d, lat, lng, meth, asrFactor) {
    const jd = julian(y, m, d) - lng / (15 * 24);
    const mid = t => fix(12 - sunPos(jd + t).eqt, 24);
    const angleT = (a, t, ccw) => { const de = sunPos(jd + t).decl, v = (-sin(a) - sin(de) * sin(lat)) / (cos(de) * cos(lat)); if (v < -1 || v > 1) return NaN; const T = acos(v) / 15, n = mid(t); return n + (ccw ? -T : T); };
    const asrT = (f, t) => { const de = sunPos(jd + t).decl; return angleT(-acot(f + tan(Math.abs(lat - de))), t); };
    let t = {fajr: 5, sunrise: 6, dhuhr: 12, asr: 13, sunset: 18, isha: 18};
    const p = x => (isNaN(x) ? 12 : x) / 24;
    t = {fajr: angleT(meth.fajr, p(t.fajr), true), sunrise: angleT(0.833, p(t.sunrise), true), dhuhr: mid(p(t.dhuhr)), asr: asrT(asrFactor, p(t.asr)), sunset: angleT(0.833, p(t.sunset), false), isha: meth.ishaMin ? NaN : angleT(meth.isha, p(t.isha), false)};
    const night = t.sunrise + 24 - t.sunset;
    const fMax = night * meth.fajr / 60;
    if (isNaN(t.fajr) || t.sunrise - t.fajr > fMax) t.fajr = t.sunrise - fMax;
    if (meth.ishaMin) t.isha = t.sunset + meth.ishaMin / 60;
    else { const iMax = night * meth.isha / 60; if (isNaN(t.isha) || t.isha - t.sunset > iMax) t.isha = t.sunset + iMax; }
    t.dhuhr += 1 / 60;
    const base = Date.UTC(y, m - 1, d), out = {};
    for (const k in t) out[k] = Math.round((base + (t[k] - lng / 15) * HOUR) / MIN) * MIN;
    out.maghrib = out.sunset;
    return out;
  }
  return {compute};
})();

/* Time zones */
const tzf = {};
const TZF = tz => tzf[tz] || (tzf[tz] = new Intl.DateTimeFormat('en-US', {timeZone: tz, hourCycle: 'h23', year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', second: 'numeric'}));

function tzOffset(ms, tz) { const p = tzParts(ms, tz); return (Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute, p.second) - Math.floor(ms / 1000) * 1000) / MIN; }
function localToMs(iso, minutes, tz) { const [y, m, d] = isoParts(iso); const guess = Date.UTC(y, m - 1, d, 0, minutes); const o1 = tzOffset(guess, tz); let ms = guess - o1 * MIN; const o2 = tzOffset(ms, tz); if (o2 !== o1) ms = guess - o2 * MIN; return ms; }
function civil(ms) { const p = tzParts(ms, city().tz); return {iso: `${p.year}-${pad(p.month)}-${pad(p.day)}`, min: p.hour * 60 + p.minute}; }

/* Upcoming */
function upcomingRows() {
  const now = nowMs(), rows = [], seen = new Set(), series = {};
  for (let i = 0; i < 60; i++) {
    const iso = isoAdd(S.date, i), D = dayInfo(iso);
    if (D.h.hd === 1 && i > 0) rows.push({iso, kind: 'month', h: D.h});
    for (const o of occsForDay(iso)) {
      if (o.end <= now) continue;
      const it = ITEMS[o.item];
      if (o.noUpcoming || it.weather || ['afterJumuah', 'ramadanDaily', 'makeup'].includes(o.item)) continue;
      if (o.kind !== 'marker' && level(o.item) === 'off') continue;
      const sk = o.series || o.key;
      (series[sk] = series[sk] || []).push(iso);
      if (seen.has(sk)) continue; seen.add(sk);
      rows.push({iso, kind: 'item', o, sk});
    }
  }
  for (const r of rows) if (r.kind === 'item') { const ds = series[r.sk]; if (ds.length > 1) r.range = [ds[0], ds[ds.length - 1]]; }
  return rows;
}
function rowSub(r) {
  const o = r.o, h = dayInfo(r.iso).h;
  if (r.range) {
    const a = dayInfo(r.range[0]).h, b = dayInfo(r.range[1]).h;
    const hj = a.hm === b.hm ? `${a.hd}–${b.hd} ${HM[a.hm]}` : `${hijriLabel(a)} – ${hijriLabel(b)}`;
    return `${hj} · to ${fmtShort(r.range[1])}`;
  }
  let s = hijriLabel(h);
  if (o.startAnchor && !['all day', 'from Fajr', 'time'].includes(o.startAnchor)) s += ' · ' + o.startAnchor;
  if (o.startAnchor === 'time') s += ' · ' + fmtTime(o.start);
  return s;
}
function renderUpcoming() {
  const rows = upcomingRows().filter(r => {
    if (r.kind === 'month') return true;
    if (S.filter === 'fasts') return r.o.fast || r.o.noFast;
    if (S.filter === 'push') return level(r.o.pushItem || r.o.item) === 'push' && r.o.kind !== 'marker';
    return true;
  });
  const weekStart = iso => isoAdd(iso, -((wdOf(iso) + 6) % 7));
  const w0 = weekStart(S.date);
  const weeks = [];
  for (const r of rows) { const ws = weekStart(r.iso); let w = weeks[weeks.length - 1]; if (!w || w.ws !== ws) weeks.push(w = {ws, rows: []}); w.rows.push(r); }
  const count = rows.filter(r => r.kind === 'item').length;
  const end = isoAdd(S.date, 59);
  let html = `<div class="scroll"><header class="hero"><h1 class="page-title">Upcoming</h1><div class="sub">Next 60 days, to ${fmtShort(end)}</div></header>
    <div class="filters chips">${[['all', 'All'], ['fasts', 'Fasts'], ['push', 'Notifies me']].map(([v, l]) => `<button class="chip ${S.filter === v ? 'on' : ''}" data-act="filter" data-v="${v}">${S.filter === v ? I('check') : ''}${l}</button>`).join('')}</div>`;
  if (!weeks.length) html += `<div class="empty" style="margin-top:20px">${I('event')}<div><div class="t">Nothing matches</div><div class="s">Try All to see every item in the next 60 days.</div></div></div>`;
  for (const w of weeks) {
    const n = dayDiff(w.ws, w0) / 7;
    const label = n === 0 ? 'This week' : n === 1 ? 'Next week' : `Week of ${isoParts(w.ws)[2]} ${MON[isoParts(w.ws)[1] - 1]}`;
    const we = isoAdd(w.ws, 6), [, m1, d1] = isoParts(w.ws), [, m2, d2] = isoParts(we);

    <p class="cap" style="text-align:center;margin-top:16px">${count} items in the next 60 days</p></div>`;
  return html;
}

  return null;
}

function weekStrip() {
  const ws = isoAdd(S.date, -((wdOf(S.date) + 6) % 7));
  const days = Array.from({length: 7}, (_, i) => isoAdd(ws, i));
  const h0 = dayInfo(days[0]).h, h6 = dayInfo(days[6]).h;
  const cells = days.map(d => {
    const h = dayInfo(d).h;
    return `<div class="${d === S.date ? 'on' : ''}"><span class="w">${WDS[wdOf(d)].slice(0, 2)}</span><span class="g">${isoParts(d)[2]}</span><span class="hj">${h.hd}${h.hd === 1 ? `<small>${HM[h.hm].split(' ')[0].slice(0, 5)}</small>` : ''}</span></div>`;
  }).join('');
  const hm = h0.hm === h6.hm ? HM[h0.hm] : `${HM[h0.hm]} – ${HM[h6.hm]}`;
  return `<div class="weekstrip" aria-label="This week in both calendars">${cells}</div><div class="ws-cap"><span>${MON[isoParts(days[0])[1] - 1]} ${isoParts(days[0])[0]}</span><span class="dark-gold">${esc(hm)} ${h6.hy}</span></div>`;
}

function notifCardHTML(n, preview) {
  return `<div class="ncard" ${preview ? '' : `data-act="notif-open" data-id="${esc(n.id)}"`}><div class="nhead"><span class="nicon">${CRESCENT()}</span>Adwam · ${esc(n.when)}</div><div class="t">${esc(n.title)}</div><div class="b">${esc(n.body)}</div>${n.actions && n.actions.length ? `<div class="na">${n.actions.map(a => `<button ${preview ? 'tabindex="-1"' : `data-act="notif-${a.toLowerCase()}" data-id="${esc(n.id)}"`}>${a}</button>`).join('')}</div>` : ''}</div>`;
}
function notifFor(o, now) {
  const ago = now - o.push, when = ago < MIN ? 'now' : ago < HOUR ? Math.round(ago / MIN) + 'm' : Math.round(ago / HOUR) + 'h';
  const base = {id: 'n:' + o.key + ':' + o.push, o, when};
  const wd = WD[wdOf(o.date)];
  switch (o.item) {
    case 'monthu': return Object.assign(base, {title: `Tomorrow is ${wd}, a Sunnah fast`, body: 'Deeds are presented on Mondays and Thursdays.', actions: ['Later']});
    case 'whiteDays': return Object.assign(base, {title: 'The White Days start tomorrow', body: `Fast the 13th, 14th and 15th of ${HM[dayInfo(o.date).h.hm]}.`, actions: ['Later']});
    case 'fridayPrep': {
      const k = occsForDay(isoAdd(o.date, -1)).find(x => x.item === 'kahf');
      const withKahf = k && level('kahf') === 'push' && !S.done[k.key];
      return Object.assign(base, withKahf ? {title: 'Friday · al-Kahf and preparation', body: 'Ghusl, siwāk, clean clothes, arrive early. Read al-Kahf before Maghrib.', actions: ['Later'], combined: true} : {title: 'Friday preparation', body: '2 hours to Jumuʿah. Ghusl, siwāk, clean clothes, arrive early.', actions: ['Done', 'Later']});
    }
    case 'kahf': return null;
    case 'lastHour': return Object.assign(base, {title: 'Last hour of Friday', body: 'About 45 minutes to Maghrib. Spend it in duʿāʾ.', actions: ['Done', 'Later']});
    case 'rain': return Object.assign(base, {title: 'Rain is likely starting in your area', body: 'Say: Allāhumma ṣayyiban nāfiʿan.', actions: ['Done', 'Later']});
    case 'lastTen': return Object.assign(base, {title: 'The last ten nights have begun', body: 'Seek Laylat al-Qadr every night until Ramadan ends.', actions: ['Later']});
    case 'prayers': return Object.assign(base, {title: `Time for ${o.title}`, body: 'Mark it done once you’ve prayed.', actions: ['Done', 'Later']});
    default: return Object.assign(base, {title: ITEMS[o.item].name, body: o.short || ITEMS[o.item].short, actions: o.check === 'done' ? ['Done', 'Later'] : ['Later']});
  }
}
function pushesBetween(a, b) {
  let all = [];
  for (let i = -2; i <= 12; i++) all = all.concat(occsForDay(isoAdd(S.date, i)));
  if (S.rain) all.push(rainOcc());
  const seen = new Set();
  return all.map(prayerPush).filter(o => o.push && o.push > a && o.push <= b && pushAllowed(o) && !(o.item === 'kahf') && !(o.check === 'done' && isDone(o)) && !seen.has(o.key + o.push) && seen.add(o.key + o.push)).sort((x, y) => y.push - x.push);
}
function delivered() {
  const now = nowMs();
  return pushesBetween(now - 20 * HOUR, now).map(o => notifFor(o, now)).filter(n => n && !S.notifGone[n.id]);
}

    <div class="tiles"><span class="tile on">${I('wifi')}</span><span class="tile">${I('bluetooth')}</span><span class="tile">${I('flashlight_on')}</span><span class="tile on">${I('screen_rotation')}</span></div><div class="grab"></div></div>
    <div class="nlist">${S.notif !== 'granted' ? `<p class="nempty">Adwam notifications are off, so nothing arrives here. Turn them on in Settings, Notifications.</p>` : list.length ? list.map(n => notifCardHTML(n)).join('') : `<p class="nempty">No notifications.<br>Use “Next push” in the panel to jump to the next one.</p>`}</div>
    ${list.length && S.notif === 'granted' ? `<button class="clear" data-act="notif-clear">Clear all</button>` : ''}
    <div class="closebar" data-act="shade-close" title="Close"><span></span></div>`;

    let msg = on ? 'Fast logged for today' : 'Fast unticked';
    if (on && h.hm === 10 && h.hd >= 2) msg = `Fast logged · Shawwāl ${Math.min(6, shawwalCount(h.hy))} of 6`;
    else if (on && [13, 14, 15].includes(h.hd)) msg = `Fast logged · White Days ${Math.min(3, monthFasts(h.hy, h.hm))} of 3`;
    snack(msg, on ? 'Undo' : null, () => { delete S.fastLog[fastDate]; render(); });
    return;
  }
  const on = !S.done[key];
  if (on) S.done[key] = true; else delete S.done[key];

document.addEventListener('click', e => {

    case 'pausesw': if (paused()) { S.pause = null; render(); } else { S.pause = {days: 7, until: isoAdd(S.date, 6)}; render(); snack('Fasting reminders paused for 7 days', 'Undo', () => { S.pause = null; render(); }); } break;

      break;
    }
    case 'logmakeup': {
      if (!S.makeup) break; S.makeup--; render();
      snack(S.makeup ? `Make-up fast logged · ${S.makeup} left` : 'All made up. The card leaves Today.', 'Undo', () => { S.makeup++; render(); }); break;
    }
    case 'mk': UI.mkDraft = Math.max(0, (UI.mkDraft ?? 0) + +v); render(); break;
    case 'mksave': S.makeup = UI.mkDraft ?? 0; render(); break;
    case 'copy': { try { navigator.clipboard && navigator.clipboard.writeText(v); } catch (err) {} snack('Duʿāʾ copied'); break; }
    case 'ext-btn': window.open(v, '_blank', 'noopener'); break;
    case 'sheet': if (v === 'report') UI.reportItem = el.dataset.item; if (v === 'city') UI.query = ''; openSheet(v); break;
    case 'close': closeOverlay(); break;
    case 'snack': { $('#snack').classList.remove('show'); const fn = UI.snackFn; UI.snackFn = null; if (fn) fn(); break; }
    /* setup */
    case 'uselocation': openDialog('loc'); break;
    case 'locperm': {
      closeOverlay();
      if (v === 'deny') { snack('No problem. Pick your city instead.'); setTimeout(() => openSheet('city', {query: ''}), 400); break; }
      UI.locBusy = true; render();
      setTimeout(() => { UI.locBusy = false; S.city = 'london'; S.locMode = 'current'; S.method = CITIES.london.method; S.step = 2; UI.anim = 'push'; render(); }, 700);
      break;
    }
    case 'pickcity': {
      if (v === '__current') { S.locMode = 'current'; S.city = 'london'; }
      else { S.city = v; S.locMode = 'city'; S.method = CITIES[v].method; }
      closeOverlay();
      if (!S.setupDone && S.step === 1) { S.step = 2; UI.anim = 'push'; }
      render(); break;
    }
    case 'setupback': back(); break;
    case 'shift': S.hijriShift = +v; render(); break;
    case 'setpreset': S.setupPreset = v; render(); break;
    case 'setprayers': S.setupPrayers = v; render(); break;
    case 'next': {
      if (S.step === 4) {
        applyPreset(S.setupPreset === 'inapp' ? 'inapp' : 'recommended');
        if (S.setupPreset === 'inapp' && S.setupPrayers !== 'push') { S.notif = 'unset'; finishSetup(); break; }
      }
      S.step++; UI.anim = 'push'; render(); break;
    }
    case 'asknotif': openDialog('notif'); break;
    case 'notifperm': S.notif = v; closeOverlay(); setTimeout(finishSetup, 220); break;
    case 'notnow': S.notif = 'unset'; finishSetup(); break;
    case 'finishchoose': UI.fromSetup = false; S.stack = []; S.tab = 'today'; UI.anim = 'fade'; render(); snack('You’re all set. Change anything in Settings.'); break;
    /* settings sheets */
    case 'method': S.method = v; render(); break;
    case 'asr': S.asr = v; render(); break;
    case 'jmode': S.jumuah.mode = v; render(); break;
    case 'jtime': S.jumuah.time = v; render(); break;
    case 'hmethod': S.hijriMethod = v; render(); break;
    case 'eclq': S.eclipseQuiet = !S.eclipseQuiet; render(); break;
    case 'prayq': S.prayerQuiet = !S.prayerQuiet; render(); break;
    case 'theme': S.theme = v; render(); break;
    case 'notifsw': S.notif = S.notif === 'granted' ? 'denied' : 'granted'; render(); break;
    case 'channel': S.channels[v] = S.channels[v] === false; render(); break;
    case 'sendreport': closeOverlay(); UI.reportText = ''; snack('In the app, this opens the issue form in your browser'); break;
    /* notifications */
    case 'notif-open': openNotif(findNotif(el.dataset.id)); break;
    case 'notif-done': { const n = findNotif(el.dataset.id); if (n) { S.done[n.o.key] = true; S.notifGone[n.id] = true; } render(); $('#headsup').classList.remove('show'); break; }
    case 'notif-later': { const n = findNotif(el.dataset.id); if (n) S.notifGone[n.id] = true; render(); $('#headsup').classList.remove('show'); if (!UI.shade) snack('We’ll remind you again in an hour'); break; }
    case 'notif-clear': for (const n of delivered()) S.notifGone[n.id] = true; render(); break;
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'cityq') { UI.query = e.target.value; renderOverlays(false); }
  if (e.target.id === 'reportText') UI.reportText = e.target.value;
  if (e.target.id === 'pgTime') { S.minutes = +e.target.value; S.moment = 'custom'; if (S.rain && S.rainAt !== null && S.minutes < S.rainAt) S.rainAt = S.minutes; renderSoon(); }
});
document.addEventListener('change', e => {
  const a = e.target.dataset.change;
  if (a === 'qstart') { S.quiet.start = e.target.value; render(); }
  if (a === 'qend') { S.quiet.end = e.target.value; render(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#lightboxRoot').innerHTML) { $('#lightboxRoot').innerHTML = ''; return; } back(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('#screen [role="button"], #screen [tabindex="0"]') && !e.target.matches('button, input, textarea, select')) { e.preventDefault(); e.target.click(); }
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => render());

function renderRail() {
  const L = $('#railLeft');

  const h = effHijri();
  const cur = S.setupDone ? current().s : 'setup';
  const nav = [['setup', 'Setup', 'restart_alt'], ['today', 'Today', 'today'], ['upcoming', 'Upcoming', 'format_list_bulleted'], ['settings', 'Settings', 'settings'], ['reminders', 'Reminders', 'tune'], ['about', 'About', 'info'], ['detail', 'A detail', 'menu_book'], ['shade', 'Notifications', 'notifications']];
  L.innerHTML = `<div class="brand">${CRESCENT()}<b>Adwam</b></div>
    <p class="lede">An interactive prototype refined from the 24 Almanac mockups. Everything inside the phone works: tick cards, open details, change settings.</p>
    <button class="pg-btn rail-toggle" style="margin-top:12px;width:100%" data-pg="openRight">${I('history')}Review of the 24 mockups</button>
    <h4>Go to</h4><div class="pg-grid">${nav.map(([k, l, ic]) => `<button class="pg-btn ${cur === k ? 'on' : ''}" data-pg="nav" data-v="${k}">${I(ic)}${l}</button>`).join('')}</div>
    <h4>Moment</h4><div class="moments">${MOMENTS.map(m => `<button class="moment ${S.moment === m.id ? 'on' : ''}" data-pg="moment" data-v="${m.id}"><b>${m.label}</b><span>${m.sub}</span></button>`).join('')}</div>
    <h4>Clock</h4><div class="clock"><div class="clock-row"><button class="pg-icon" data-pg="day" data-v="-1" aria-label="Previous day">${I('chevron_left')}</button><div class="date">${dateLbl}<small>${h.hd} ${HM[h.hm]} ${h.hy}${h.after ? ' · after Maghrib' : ''}</small></div><button class="pg-icon" data-pg="day" data-v="1" aria-label="Next day">${I('chevron_right')}</button></div>
      <input id="pgTime" type="range" min="0" max="1439" step="1" value="${S.minutes}" aria-label="Time of day"><div class="time"><span>Midnight</span><b>${fmtHM(S.minutes)}</b><span>11:59 pm</span></div>
      <button class="pg-btn" data-pg="nextpush">${I('notifications_active')}Jump to the next push</button></div>

      <div class="toggle-row">Date correction offer<button class="pg-switch ${S.correction ? 'on' : ''}" data-pg="correction" aria-label="Date correction"></button></div></div>

    <button class="pg-btn" style="margin-top:22px;width:100%;justify-content:center" data-pg="reset">${I('restart_alt')}Reset the prototype</button>`;
  const t = document.getElementById('pgTime'); if (t && document.activeElement !== t) t.value = S.minutes;
}
function renderReview() {
  $('#railRight').innerHTML = `<div class="brand" style="justify-content:space-between"><b style="font-size:19px">Review of the 24 mockups</b><button class="pg-icon rail-toggle" data-pg="closeRight" aria-label="Close">${I('close')}</button></div>
    <p class="rv-intro" style="margin-top:10px">What changed from the original Almanac mockups, and why. “Open” jumps the phone to the same state.</p>
    <h4>Across the set</h4><ul class="rv-list">
      <li><b>Blank lower halves</b> on 12 of 24 screens. Setup actions now sit in the thumb zone, Today gained a day line and a real empty state, and About gained content.</li>
      <li><b>Five header patterns, now two:</b> tab roots get a large serif title, a subtitle and a gold rule; sub-pages get a back arrow and a title that wraps.</li>
      <li><b>Four button shapes, now one set:</b> filled, outlined, tonal and text, all 48 dp pills.</li>
      <li><b>Five segmented-control styles, now one:</b> a 40 dp Material 3 segmented button with a check on the selected option.</li>
      <li><b>One card anatomy:</b> title, time left with a bell when it pushes, one line, then the checkbox. Weather cards add an icon and the credit.</li>
      <li><b>No double rules.</b> Detail screens had gold dividers and green section rules; now each section has one light rule.</li>
      <li><b>Real transliteration marks.</b> ʿ and ʾ are U+02BF and U+02BE in Source Serif 4 and Source Sans 3, which both include them. They no longer look like curly quotes.</li>
      <li><b>Correct dates.</b> Hijri dates come from Umm al-Qura and prayer times are calculated for the chosen city, so every moment is internally consistent. 18 Dec 2026 is 9 Rajab, not 8.</li>
    </ul>
    <h4>Merged</h4><ul class="rv-list">
      <li><b>06, 07, 08, 09, 10, 11, 17, 18</b> are one Today screen. Its state comes from the date, the time and your ticks. Use Moment and Clock.</li>
      <li><b>04 + 05</b> → one notification step. <b>15 + 16</b> → one Upcoming list. <b>20 + 21 + 22</b> → one Reminders screen. <b>12–14</b> → one detail template.</li>
    </ul>
    <h4>Added</h4><ul class="rv-list">
      <li><b>Day line</b> on Today: Fajr to ʿIshāʾ, a now marker, and the time to Maghrib, when the Hijri day turns.</li>
      <li><b>Live push estimate</b> and presets on Reminders. <b>Pause</b> for 3, 7 or 14 days, as the spec asks.</li>
      <li><b>Prayer-time reminders:</b> a setup step, a card on Today from each prayer time with a Done tick, a push as it begins, and a Prayer times card on Reminders. Off until chosen.</li>
      <li><b>Upcoming filters</b> (All, Fasts, Notifies me), month-start rows and No fasting tags.</li>
      <li><b>Undo</b> on every tick, <b>Appearance</b> with a dark theme, a <b>Privacy</b> section, a <b>Report a problem</b> sheet, and a working <b>notification shade</b> with Android channels.</li>

    <h4>Screen by screen</h4>${REVIEW.map((r, i) => `<div class="rv-screen"><div class="h"><span class="n">${r.n}</span><span class="t">${r.t}</span></div><p>${esc(r.issue)}</p><p><b>Now:</b> ${esc(r.fix)}</p><div class="rv-actions"><button data-pg="rvgo" data-v="${i}">${I('arrow_forward')}Open</button></div></div>`).join('')}`;
}
function pageAction(el, e) {
  const a = el.dataset.pg, v = el.dataset.v;
  if (['nav', 'rvgo', 'reset', 'day'].includes(a)) hideSnack();
  switch (a) {
    case 'nav': {
      closeShade(); closeOverlay();
      if (v === 'setup') { S.setupDone = false; S.step = 1; UI.anim = 'fade'; render(); break; }
      if (v === 'shade') { if (!S.setupDone) { S.setupDone = true; render(); } openShade(); break; }
      if (!S.setupDone) S.setupDone = true;
      if (['today', 'upcoming', 'settings'].includes(v)) { setTab(v); break; }
      S.tab = v === 'detail' ? 'today' : 'settings'; S.stack = [];
      if (v === 'detail') S.stack.push({s: 'detail', item: 'kahf', date: null});
      else S.stack.push({s: v});
      UI.anim = 'push'; render(); break;
    }
    case 'moment': applyMoment(v); break;
    case 'day': S.date = isoAdd(S.date, +v); S.moment = 'custom'; if (S.rain) S.rain = false; render(); break;
    case 'nextpush': nextPush(); break;
    case 'rain': S.rain = !S.rain; S.rainAt = S.rain ? S.minutes : null; S.moment = 'custom'; render(); break;
    case 'notif': S.notif = S.notif === 'granted' ? 'denied' : 'granted'; render(); break;
    case 'correction': S.correction = !S.correction; S.correctionChoice = null; render(); break;
    case 'theme': S.theme = v; render(); break;
    case 'reset': try { localStorage.removeItem(STORE_KEY); } catch (err) {} S = defaults(); UI.scroll = {}; closeOverlay(); closeShade(); UI.anim = 'fade'; render(); break;
    case 'openRight': $('#railRight').classList.add('open'); break;
    case 'closeRight': $('#railRight').classList.remove('open'); break;
    case 'openLeft': $('#railLeft').classList.toggle('open'); break;
    case 'rvgo': {
      const r = REVIEW[+v], [k, x] = r.go; closeShade(); closeOverlay();
      if (k === 'setup') { S.setupDone = false; S.step = x; UI.anim = 'fade'; render(); }
      else if (k === 'moment') applyMoment(x);
      else if (k === 'tab') { if (!S.setupDone) S.setupDone = true; setTab(x); }
      else if (k === 'push') { if (!S.setupDone) S.setupDone = true; S.tab = 'settings'; S.stack = [{s: x}]; UI.anim = 'push'; render(); }
      else if (k === 'detail') { applyMoment('fri-am'); S.stack = [{s: 'detail', item: x, date: '2026-12-17'}]; UI.anim = 'push'; render(); }
      else if (k === 'shade') { applyMoment('fri-pm'); openShade(); }
      if (innerWidth <= 1240) $('#railRight').classList.remove('open');
      break;
    }
  }
}

/* phone scale */
function fit() {
  const full = innerWidth <= 520;
  document.body.classList.toggle('fullscreen', full);
  const phone = $('#phone'), wrap = $('#phoneWrap'), screen = $('#screen');
  if (full) {
    phone.style.transform = 'none'; phone.style.width = innerWidth + 'px'; phone.style.height = innerHeight + 'px';
    screen.style.width = innerWidth + 'px'; screen.style.height = innerHeight + 'px';
    wrap.style.width = innerWidth + 'px'; wrap.style.height = innerHeight + 'px';
    return;
  }
  phone.style.width = ''; phone.style.height = ''; screen.style.width = ''; screen.style.height = '';
  const availH = innerHeight - 64, availW = $('#center').clientWidth - 32;
  const sc = Math.min(1, availH / 939, availW / 436);
  phone.style.transform = `scale(${sc})`;
  wrap.style.width = 436 * sc + 'px'; wrap.style.height = 939 * sc + 'px';
}
addEventListener('resize', fit);

renderReview();
render();
fit();
</script>
