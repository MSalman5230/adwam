appId: ${APP_ID}
name: Setup paths on Android
---
- runFlow: setup/start.yaml
- tapOn: Use my location
- tapOn:
    id: '.*:id/permission_deny_button'
- assertVisible: Choose your city
- runFlow: setup/pick-london.yaml
- tapOn: '\+1'
- pressKey: Back
- assertVisible: 'Where are you\?'
- tapOn: Pick a city
- runFlow: setup/pick-london.yaml
- tapOn: Continue
- runFlow: setup/prayers-off.yaml
- tapOn: In-app only
- tapOn: Continue
- assertVisible: Today
- assertNotVisible: 'Allow notifications\?'

# Prayer-time pushes still need permission when every other reminder is in-app only.
- runFlow: setup/start.yaml
- tapOn: Pick a city
- runFlow: setup/pick-london.yaml
- tapOn: Continue
- assertVisible: 'Remind you at prayer times\?'
- assertVisible: 'Times use Muslim World League.*'
- tapOn: Continue
- tapOn: In-app only
- tapOn: Continue
- assertVisible: 'Allow notifications\?'
- assertVisible: Prayer times
- assertNotVisible: Fasts
- tapOn: Not now
- assertVisible: Today

- runFlow: setup/start.yaml
- runFlow: setup/place-and-date.yaml
- tapOn: Let me choose
- tapOn: Continue
- assertVisible: 'Allow notifications\?'
- tapOn: Not now
- assertVisible: Each reminder can push.*
- scrollUntilVisible:
    element: Done
    direction: DOWN
- tapOn: Done
- assertVisible: Today

- runFlow: setup/start.yaml
- runFlow: setup/place-and-date.yaml
- tapOn: Continue
- assertVisible: 'Allow notifications\?'
- tapOn: Continue
- tapOn:
    id: '.*:id/permission_allow_button'
- assertVisible: Today

- runFlow: setup/start.yaml
- runFlow: setup/place-and-date.yaml
- tapOn: Continue
- assertVisible: 'Allow notifications\?'
- tapOn: Continue
- tapOn:
    id: '.*:id/permission_deny_button'
- assertVisible: Today

- runFlow: setup/start.yaml
- runFlow: setup/place-and-date.yaml
- tapOn: Continue
- assertVisible: 'Allow notifications\?'
- tapOn: Not now
- assertVisible: Today

- runFlow: setup/start.yaml
- setLocation:
    latitude: 62.4541
    longitude: -114.3725
- tapOn: Use my location
- tapOn:
    id: '.*:id/permission_allow_foreground_only_button'
- extendedWaitUntil:
    visible: Check your Hijri date
    timeout: 20000
- assertVisible: '.* · Yellowknife'
- tapOn: Continue
- runFlow: setup/prayers-off.yaml
- tapOn: In-app only
- tapOn: Continue
- assertVisible: Today
