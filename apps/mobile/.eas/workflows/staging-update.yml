name: Publish Android Preview update

on:
  workflow_dispatch: {}

jobs:
  publish_preview:
    type: update
    environment: preview
    env:
      APP_VARIANT: preview
    params:
      channel: preview
      platform: android
      upload_sentry_sourcemaps: true
    hooks:
      before_update:
        - name: Verify the EAS account
          run: bash scripts/verify-eas-account.sh
