<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Adwam date corrections</title>
  <style>
    :root { color-scheme: light dark; --paper: #f8f5ee; --ink: #1f2a24; --ink2: #4d5a52; --green: #1f5b45; }
    @media (prefers-color-scheme: dark) {
      :root { --paper: #141a17; --ink: #ece7dc; --ink2: #b5bdb6; --green: #8fcfb0; }
    }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 34rem; margin: 0 auto; padding: 3rem 1rem; }
    h1 { font-size: 1.5rem; margin: 0 0 1rem; }
    p { color: var(--ink2); }
    a { color: var(--green); }
  </style>
</head>
<body>
  <main>
    <h1>Adwam date corrections</h1>
    <p>The production correction page opens here once Adwam's production server is set up.</p>
    <p><a href="./staging/">Staging date corrections</a> · <a href="./privacy/">Privacy notice</a></p>
  </main>
</body>
</html>
