<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Adwam Date Corrections</title>
  </head>
  <body>
    <main>
      <header>
        <p class="brand">Adwam</p>
        <h1>Date corrections</h1>
        <button id="sign-out" class="secondary sign-out" hidden>Sign out</button>
      </header>
      <p id="status" role="status" aria-live="polite" hidden></p>
      <section id="sign-in" hidden aria-labelledby="sign-in-title">
        <h2 id="sign-in-title">Sign in</h2>
        <form id="email-form">
          <label for="email">Admin email</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
          <button type="submit">Send sign-in code</button>
        </form>
        <form id="code-form" hidden>
          <label for="code">Code from your email</label>
          <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,10}" required />
          <div class="actions">
            <button type="submit">Sign in</button>
            <button id="change-email" type="button" class="secondary">Change email</button>
          </div>
        </form>
      </section>
      <div id="workspace" hidden>
        <section aria-labelledby="editor-title">
          <div class="section-heading">
            <h2 id="editor-title">New correction</h2>
            <button id="new-draft" class="secondary" hidden>New correction</button>
          </div>
          <form id="correction-form">
            <div class="fields">
              <label>Country code <input name="country" placeholder="GB" pattern="[A-Za-z]{2}" maxlength="2" required /></label>
              <label>Hijri year <input name="year" type="number" min="1" max="9999" required /></label>
              <label>Hijri month <select name="month" required><option value="">Choose a month</option></select></label>
              <label>Announced day 1 <input name="start" type="date" required /></label>
              <label class="wide">Announcement source <input name="source" type="url" placeholder="https://" required /></label>
            </div>
            <dl class="date-check">
              <div><dt>Umm al-Qura day 1</dt><dd id="reference-date">—</dd></div>
              <div><dt>Affected installs</dt><dd id="estimate">—</dd></div>
            </dl>
            <p id="date-warning" class="warning" role="status" hidden></p>
            <div class="actions">
              <button type="submit" name="action" value="save" class="secondary">Save draft</button>
              <button type="submit" name="action" value="estimate" class="secondary">Estimate</button>
              <button type="submit" name="action" value="publish">Publish</button>
            </div>
          </form>
        </section>
        <section aria-labelledby="history-title">
          <h2 id="history-title">Past corrections</h2>
          <ul id="history" class="history"></ul>
        </section>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
