name: Deploy staging

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: adwam-staging

jobs:
  backend:
    runs-on: ubuntu-latest
    environment: staging
    env:
      APP_VARIANT: preview
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm server:prepare
      - name: Apply staging migrations
        run: |
          [[ "$SUPABASE_PROJECT_ID" =~ ^[a-z0-9]{20}$ && -n "$SUPABASE_ACCESS_TOKEN" ]]
          pnpm exec supabase db push --remote="$SUPABASE_PROJECT_ID" --yes
      - name: Deploy staging Edge Functions
        run: pnpm exec supabase functions deploy --remote="$SUPABASE_PROJECT_ID" --use-api --yes
      - name: Configure staging Auth
        run: node scripts/staging-auth.mjs

  preview:
    needs: backend
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: '27.11.0'
          token: ${{ secrets.EXPO_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - name: Read the staging app configuration
        env:
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/staging-public-config.mjs EXPO_PUBLIC >> "$GITHUB_ENV"
      - name: Configure and publish Android Preview
        working-directory: apps/mobile
        env:
          APP_VARIANT: preview
        run: |
          bash scripts/verify-eas-account.sh
          eas env:set preview --name EXPO_PUBLIC_SUPABASE_URL --value "$EXPO_PUBLIC_SUPABASE_URL" --scope project --visibility plaintext --non-interactive >/dev/null
          bash scripts/verify-eas-account.sh
          eas env:set preview --name EXPO_PUBLIC_SUPABASE_KEY --value "$EXPO_PUBLIC_SUPABASE_KEY" --scope project --visibility plaintext --non-interactive >/dev/null
          bash scripts/verify-eas-account.sh
          eas workflow:run .eas/workflows/staging-update.yml --non-interactive --wait
