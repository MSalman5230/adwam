name: Deploy staging

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: adwam-staging

jobs:
  backend:
    runs-on: ubuntu-latest
    environment: staging
    env:
      APP_VARIANT: preview
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy the staging server
        env:
          ADWAM_ENVIRONMENT: staging
          ADMIN_URL: https://msalman5230.github.io/adwam/staging/
        run: bash scripts/deploy-backend.sh

  preview:
    needs: backend
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: '27.11.0'
          token: ${{ secrets.EXPO_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - name: Read the staging app configuration
        env:
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/supabase-public-config.mjs EXPO_PUBLIC >> "$GITHUB_ENV"
      - name: Resolve the Android runtime
        id: runtime
        working-directory: apps/mobile
        env:
          APP_VARIANT: preview
        run: |
          runtime=$(pnpm exec expo-updates runtimeversion:resolve --platform android --workflow managed |
            jq -er '.runtimeVersion | select(test("^[a-f0-9]{40}$"))')
          echo "Android Preview runtime: $runtime"
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
      - name: Publish the Android Preview update
        working-directory: apps/mobile
        env:
          APP_VARIANT: preview
          RUNTIME: ${{ steps.runtime.outputs.runtime }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          bash scripts/verify-eas-account.sh
          eas env:set preview --name EXPO_PUBLIC_SUPABASE_URL --value "$EXPO_PUBLIC_SUPABASE_URL" --scope project --visibility plaintext --non-interactive >/dev/null
          bash scripts/verify-eas-account.sh
          eas env:set preview --name EXPO_PUBLIC_SUPABASE_KEY --value "$EXPO_PUBLIC_SUPABASE_KEY" --scope project --visibility plaintext --non-interactive >/dev/null
          message="$(git log -1 --format='%h %s')"
          result="$RUNNER_TEMP/preview-update.json"
          bash scripts/verify-eas-account.sh
          eas update --channel preview --platform android --environment preview --message "$message" --non-interactive --json > "$result"
          group=$(jq -er '[.[] | select(.platform == "android")][0].group' "$result")
          published=$(jq -er '[.[] | select(.platform == "android")][0].runtimeVersion' "$result")
          if [[ "$published" != "$RUNTIME" ]]; then
            echo "EAS published runtime $published, but this runner resolved $RUNTIME." >&2
            exit 1
          fi
          if [[ -n "$SENTRY_AUTH_TOKEN" && -n "$SENTRY_ORG" && -n "$SENTRY_PROJECT" ]]; then
            pnpm exec sentry-expo-upload-sourcemaps dist
          else
            echo '::warning::The staging environment has no Sentry upload settings, so this update has no source maps in Sentry.'
          fi
          {
            echo '### Adwam Preview update'
            echo
            echo "[Update group $group](https://expo.dev/accounts/msalman5230/projects/adwam/updates/$group) on the \`preview\` channel, runtime \`$RUNTIME\`."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Look for a matching Preview build
        id: match
        working-directory: apps/mobile
        env:
          RUNTIME: ${{ steps.runtime.outputs.runtime }}
        run: |
          bash scripts/verify-eas-account.sh
          build_id=$(eas build:list --build-profile preview --platform android --status finished \
            --runtime-version "$RUNTIME" --limit 1 --json --non-interactive | jq -r '.[0].id // empty')
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
          if [[ -z "$build_id" ]]; then
            echo "::notice::No Preview build has runtime $RUNTIME. Press Android preview build so Preview phones get this change."
          fi
      - name: Update the Preview build reminder
        uses: actions/github-script@v8
        env:
          RUNTIME: ${{ steps.runtime.outputs.runtime }}
          BUILD_ID: ${{ steps.match.outputs.build_id }}
        with:
          script: |
            const { syncPreviewReminder } = await import(`${process.cwd()}/scripts/preview-reminder.mjs`);
            const result = await syncPreviewReminder({
              github, context, runtime: process.env.RUNTIME, buildId: process.env.BUILD_ID || undefined,
            });
            core.info(`Preview build reminder: ${result}.`);
