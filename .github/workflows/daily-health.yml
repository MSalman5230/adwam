name: Staging weather health

on:
  workflow_dispatch:
  schedule:
    - cron: '28 8 * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: adwam-stage-health

jobs:
  staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: actions/github-script@v8
        env:
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        with:
          script: |
            const { stagingWeatherHealth, stagingPushSummary } = await import(`${process.cwd()}/scripts/staging-health.mjs`);
            const failures = await stagingWeatherHealth().catch(() => ['The staging health check could not reach Supabase.']);
            if (context.eventName === 'workflow_dispatch') core.info(await stagingPushSummary());
            if (!failures.length) {
              core.info('Staging weather is current and within budget.');
              return;
            }
            const title = 'Staging weather health check failed';
            const repository = context.repo;
            const open = await github.paginate(github.rest.issues.listForRepo, { ...repository, state: 'open', per_page: 100 });
            if (!open.some((issue) => !issue.pull_request && issue.title === title)) {
              const run = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              await github.rest.issues.create({ ...repository, title, body: `${failures.map((entry) => `- ${entry}`).join('\n')}\n\n[Workflow run](${run})` });
            }
            core.setFailed(failures.join(' '));
