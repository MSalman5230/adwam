name: Ship update

on:
  workflow_dispatch:
    inputs:
      server_only:
        description: Deploy only the production server, with no app update
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    name: Update plan
    runs-on: ubuntu-latest
    environment: production-monitor
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      runtime: ${{ steps.runtime.outputs.runtime }}
    steps:
      - name: Require master
        if: github.ref != 'refs/heads/master'
        run: |
          echo '::error::Ship updates from master, so production gets what staging already runs.'
          exit 1
      - name: Require the production setup
        env:
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          if [[ -z "$SUPABASE_PROJECT_ID" ]]; then
            echo "::error::Production isn't set up yet (task M6.12)."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: '27.11.0'
          token: ${{ secrets.EXPO_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - name: Resolve the Android runtime
        id: runtime
        working-directory: apps/mobile
        env:
          APP_VARIANT: production
        run: |
          runtime=$(pnpm exec expo-updates runtimeversion:resolve --platform android --workflow managed |
            jq -er '.runtimeVersion | select(test("^[a-f0-9]{40}$"))')
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
      - name: Find the Play build this update reaches
        id: build
        if: ${{ !inputs.server_only }}
        working-directory: apps/mobile
        env:
          RUNTIME: ${{ steps.runtime.outputs.runtime }}
        run: |
          bash scripts/verify-eas-account.sh
          builds=$(eas build:list --build-profile production --platform android --status finished \
            --runtime-version "$RUNTIME" --limit 1 --json --non-interactive)
          if ! jq -e 'length > 0' <<< "$builds" >/dev/null; then
            echo "::error::No production Play build has runtime $RUNTIME. The native code changed since the last Play release, so this has to ship through the Release PR."
            exit 1
          fi
          echo "description=version $(jq -r '.[0].appVersion' <<< "$builds"), code $(jq -r '.[0].appBuildVersion' <<< "$builds")" >> "$GITHUB_OUTPUT"
          bash scripts/verify-eas-account.sh
          updates=$(eas update:list --branch production --platform android --limit 25 --json --non-interactive 2>/dev/null || echo '{}')
          active=$(jq -r --arg runtime "$RUNTIME" '[(.currentPage // [])[]
            | select(.runtimeVersion == $runtime and .rolloutPercentage != null and .rolloutPercentage < 100)][0].group // empty' <<< "$updates")
          if [[ -n "$active" ]]; then
            echo "::error::Update $active is still rolling out to these phones. Finish or undo it with Production rollout first."
            exit 1
          fi
      - name: Check staging and list migrations
        uses: actions/github-script@v8
        env:
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RUNTIME: ${{ steps.runtime.outputs.runtime }}
          BUILD: ${{ steps.build.outputs.description }}
          SERVER_ONLY: ${{ inputs.server_only }}
        with:
          script: |
            const plan = await import(`${process.cwd()}/scripts/production-plan.mjs`);
            const staging = await plan.waitForStagingDeploy({ github, context, sha: context.sha });
            const pending = await plan.appliedMigrationVersions()
              .then((applied) => applied && plan.pendingMigrations(plan.migrationFiles(), applied));
            const serverOnly = process.env.SERVER_ONLY === 'true';
            const change = serverOnly
              ? 'After approval, the production job deploys only the production server. No app update is published.'
              : `After approval, the production job deploys the production server, then publishes an update for 10% of `
                + `phones running Play ${process.env.BUILD}, runtime \`${process.env.RUNTIME}\`. Raise it with Production rollout.`;
            await core.summary
              .addHeading(`Ship ${context.sha.slice(0, 7)} to production`, 3)
              .addRaw(`Staging ran this code: [Deploy staging](${staging.url}).\n\n`)
              .addRaw(`${plan.describeMigrations(pending)}\n\n`)
              .addRaw(`${change}\n`)
              .write();

  production:
    name: Production
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    concurrency:
      group: adwam-production
    env:
      APP_VARIANT: production
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: '27.11.0'
          token: ${{ secrets.EXPO_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - name: Deploy the production server
        env:
          ADWAM_ENVIRONMENT: production
          ADMIN_URL: https://msalman5230.github.io/adwam/
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: bash scripts/deploy-backend.sh
      - name: Read the production app configuration
        if: ${{ !inputs.server_only }}
        env:
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/supabase-public-config.mjs EXPO_PUBLIC >> "$GITHUB_ENV"
      - name: Publish the update to 10% of phones
        if: ${{ !inputs.server_only }}
        working-directory: apps/mobile
        env:
          RUNTIME: ${{ needs.plan.outputs.runtime }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          bash scripts/verify-eas-account.sh
          eas env:set production --name EXPO_PUBLIC_SUPABASE_URL --value "$EXPO_PUBLIC_SUPABASE_URL" --scope project --visibility plaintext --non-interactive >/dev/null
          bash scripts/verify-eas-account.sh
          eas env:set production --name EXPO_PUBLIC_SUPABASE_KEY --value "$EXPO_PUBLIC_SUPABASE_KEY" --scope project --visibility plaintext --non-interactive >/dev/null
          message="$(git log -1 --format='%h %s')"
          result="$RUNNER_TEMP/production-update.json"
          bash scripts/verify-eas-account.sh
          eas update --channel production --platform android --environment production --rollout-percentage 10 \
            --message "$message" --non-interactive --json > "$result"
          group=$(jq -er '[.[] | select(.platform == "android")][0].group' "$result")
          published=$(jq -er '[.[] | select(.platform == "android")][0].runtimeVersion' "$result")
          if [[ "$published" != "$RUNTIME" ]]; then
            echo "EAS published runtime $published, but the plan expected $RUNTIME." >&2
            exit 1
          fi
          if [[ -n "$SENTRY_AUTH_TOKEN" && -n "$SENTRY_ORG" && -n "$SENTRY_PROJECT" ]]; then
            pnpm exec sentry-expo-upload-sourcemaps dist
          else
            echo '::warning::The production environment has no Sentry upload settings, so this update has no source maps in Sentry.'
          fi
          {
            echo '### Production update at 10%'
            echo
            echo "[Update group $group](https://expo.dev/accounts/msalman5230/projects/adwam/updates/$group), runtime \`$RUNTIME\`."
            echo
            echo 'Watch Sentry, then raise it with Production rollout, or undo it there.'
          } >> "$GITHUB_STEP_SUMMARY"
