name: Staging correction admin page

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'apps/admin/**'
      - 'packages/core/**'
      - 'packages/content/messages/en.json'
      - 'scripts/staging-public-config.mjs'
      - '.github/workflows/admin-pages.yml'
      - 'pnpm-lock.yaml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: adwam-admin-pages

jobs:
  build:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/configure-pages@v5
      - run: pnpm install --frozen-lockfile
      - name: Read the staging browser configuration
        env:
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/staging-public-config.mjs VITE >> "$GITHUB_ENV"
      - run: pnpm --filter @adwam/admin build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/admin/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
