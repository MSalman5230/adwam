name: Android preview build

on:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read

concurrency:
  group: android-preview-build

jobs:
  preview:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: '27.11.0'
          token: ${{ secrets.EXPO_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - name: Build and check the preview APK
        working-directory: apps/mobile
        shell: bash
        run: |
          identity=$(FORCE_COLOR=0 NO_COLOR=1 eas whoami)
          if grep -Fqx -e 'msalman5230' -e 'msalman5230 (authenticated using EXPO_TOKEN)' <<< "$identity"; then
            echo 'Verified the msalman5230 EAS account.'
          elif grep -Eq ' \(robot\) \(authenticated using EXPO_TOKEN\)$' <<< "$identity" &&
            [[ $(grep -c '^• ' <<< "$identity") == 1 ]] &&
            grep -Eq '^• msalman5230 \(Role: .+\)$' <<< "$identity"; then
            echo 'Verified the Expo robot is scoped to the msalman5230 account.'
          else
            echo 'EAS did not confirm the msalman5230 account for the staging build credential.' >&2
            exit 1
          fi
          shopt -s nullglob
          tools=("$ANDROID_HOME"/build-tools/*/aapt2)
          if (( ${#tools[@]} == 0 )); then
            echo 'Android build tools are missing.' >&2
            exit 1
          fi
          eas build --profile preview --platform android --non-interactive --json |
            node scripts/check-preview-apk.mjs "${tools[-1]}" -
