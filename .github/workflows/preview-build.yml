name: Android preview build

on:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read

concurrency:
  group: android-preview-build

jobs:
  preview:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: '27.11.0'
          token: ${{ secrets.EXPO_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - name: Build and check the preview APK
        working-directory: apps/mobile
        shell: bash
        run: |
          bash scripts/verify-eas-account.sh
          shopt -s nullglob
          tools=("$ANDROID_HOME"/build-tools/*/aapt2)
          if (( ${#tools[@]} == 0 )); then
            echo 'Android build tools are missing.' >&2
            exit 1
          fi
          build_result=$(mktemp "$RUNNER_TEMP/adwam-preview-build.XXXXXX")
          trap 'rm -f -- "$build_result"' EXIT
          # A regular file prevents the CLI from truncating large JSON results when it exits.
          eas build --profile preview --platform android --non-interactive --wait --json > "$build_result"
          node scripts/check-preview-apk.mjs "${tools[-1]}" - < "$build_result"
