name: Release

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    concurrency:
      group: adwam-release-pr
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the release settings
        run: |
          RELEASE_TAGS=$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/##')
          export RELEASE_TAGS
          node scripts/check-release-config.mjs
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # Pull requests opened with GitHub's built-in token don't start other workflows,
      # so start the checks master requires on the Release PR's branch.
      - name: Run the required checks on the Release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --label 'autorelease: pending' --state open --limit 1 --json headRefName,title)
          branch=$(jq -er '.[0].headRefName' <<< "$pr")
          title=$(jq -er '.[0].title' <<< "$pr")
          if [[ "$branch" != release-please--* ]]; then
            echo "Unexpected Release PR branch: $branch" >&2
            exit 1
          fi
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          gh workflow run pr-title.yml --repo "$GITHUB_REPOSITORY" --ref "$branch" -f title="$title"
          echo "Started CI and the PR title check on $branch."

  plan:
    name: Release plan
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: production-monitor
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require the production setup
        env:
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          if [[ -z "$SUPABASE_PROJECT_ID" ]]; then
            echo "::error::Production isn't set up yet (task M6.12). Once it is, re-run this workflow's failed jobs."
            exit 1
          fi
      - name: Resolve the Android runtime
        id: runtime
        working-directory: apps/mobile
        env:
          APP_VARIANT: production
        run: |
          runtime=$(pnpm exec expo-updates runtimeversion:resolve --platform android --workflow managed |
            jq -er '.runtimeVersion | select(test("^[a-f0-9]{40}$"))')
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
      - name: Check staging and list migrations
        uses: actions/github-script@v8
        env:
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SHA: ${{ needs.release-please.outputs.sha }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          RUNTIME: ${{ steps.runtime.outputs.runtime }}
        with:
          script: |
            const plan = await import(`${process.cwd()}/scripts/production-plan.mjs`);
            const staging = await plan.waitForStagingDeploy({ github, context, sha: process.env.SHA });
            const pending = await plan.appliedMigrationVersions()
              .then((applied) => applied && plan.pendingMigrations(plan.migrationFiles(), applied));
            await core.summary
              .addHeading(`Release ${process.env.TAG}`, 3)
              .addRaw(`Staging ran this code: [Deploy staging](${staging.url}).\n\n`)
              .addRaw(`Android runtime \`${process.env.RUNTIME}\`.\n\n`)
              .addRaw(`${plan.describeMigrations(pending)}\n\n`)
              .addRaw('After approval, the production job deploys the production server, builds the signed app bundle, '
                + 'and submits it to Google Play internal testing. Nothing reaches the public until it is promoted in Play Console.\n')
              .write();

  e2e:
    name: Release end-to-end tests
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/e2e-nightly.yml

  production:
    name: Production
    needs: [release-please, plan, e2e]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 150
    concurrency:
      group: adwam-production
    env:
      APP_VARIANT: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: '27.11.0'
          token: ${{ secrets.EXPO_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - name: Deploy the production server
        env:
          ADWAM_ENVIRONMENT: production
          ADMIN_URL: https://msalman5230.github.io/adwam/
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: bash scripts/deploy-backend.sh
      - name: Read the production app configuration
        env:
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/supabase-public-config.mjs EXPO_PUBLIC >> "$GITHUB_ENV"
      - name: Build the app bundle and submit it to Play internal testing
        working-directory: apps/mobile
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          bash scripts/verify-eas-account.sh
          eas env:set production --name EXPO_PUBLIC_SUPABASE_URL --value "$EXPO_PUBLIC_SUPABASE_URL" --scope project --visibility plaintext --non-interactive >/dev/null
          bash scripts/verify-eas-account.sh
          eas env:set production --name EXPO_PUBLIC_SUPABASE_KEY --value "$EXPO_PUBLIC_SUPABASE_KEY" --scope project --visibility plaintext --non-interactive >/dev/null
          result="$RUNNER_TEMP/production-build.json"
          message="Release $TAG"
          bash scripts/verify-eas-account.sh
          # eas build's --json output can start with progress text, so look the build up afterwards, as the Preview build does.
          eas build --profile production --platform android --non-interactive --wait --message "$message" --json >/dev/null
          bash scripts/verify-eas-account.sh
          eas build:list --build-profile production --platform android --git-commit-hash "$RELEASE_SHA" \
            --status finished --limit 20 --json --non-interactive > "$result"
          build=$(jq -ec --arg message "$message" 'map(select(.message == $message)) | first' "$result")
          build_id=$(jq -er '.id' <<< "$build")
          built_version=$(jq -er '.appVersion' <<< "$build")
          version_code=$(jq -er '.appBuildVersion' <<< "$build")
          runtime=$(jq -er '.runtime.version' <<< "$build")
          if [[ "$built_version" != "$VERSION" ]]; then
            echo "EAS built version $built_version, but the release is $VERSION." >&2
            exit 1
          fi
          bash scripts/verify-eas-account.sh
          eas submit --platform android --profile production --id "$build_id" --non-interactive --wait
          {
            echo "### $TAG is in Play internal testing"
            echo
            echo "[Build $build_id](https://expo.dev/accounts/msalman5230/projects/adwam/builds/$build_id): version $built_version, code $version_code, runtime \`$runtime\`."
            echo
            echo 'Next: test it from the internal testing link, then promote it in Play Console. Paste the release notes from the GitHub Release.'
          } >> "$GITHUB_STEP_SUMMARY"
