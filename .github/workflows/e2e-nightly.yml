name: Android end-to-end tests

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - .github/workflows/e2e-nightly.yml
      - apps/mobile/.maestro/**
      - apps/mobile/scripts/run-maestro-android.sh
  schedule:
    - cron: '27 1 * * *'

permissions:
  contents: read

concurrency:
  group: android-e2e-${{ github.ref }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_VARIANT: development
      MAESTRO_VERSION: '2.12.1'
      MAESTRO_CLI_NO_ANALYTICS: 'true'
      EXPO_PUBLIC_SUPABASE_URL: http://10.0.2.2:54321
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase
        run: |
          pnpm db:start >/dev/null
          local_api="$(pnpm exec supabase status -o env 2>/dev/null)"
          public_key="$(sed -n 's/^ANON_KEY="\([^"]*\)"$/\1/p' <<< "$local_api")"
          test -n "$public_key"
          printf 'EXPO_PUBLIC_SUPABASE_KEY=%s\n' "$public_key" >> "$GITHUB_ENV"
      - name: Build the emulator app
        working-directory: apps/mobile
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;37.0.0'
          pnpm exec expo prebuild --platform android --no-install
          cd android
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 -Pandroid.enableMinifyInReleaseBuilds=false --max-workers=2 --console=plain
      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Maestro
        uses: reactivecircus/android-emulator-runner@v2.36.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            adb shell cmd alarm set-timezone Europe/London
            bash apps/mobile/scripts/run-maestro-android.sh
      - name: Upload emulator results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-maestro-results
          path: maestro-results
          if-no-files-found: ignore
