name: App bug
description: Report a problem using Adwam.
title: "Bug — "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: app-version
    attributes:
      label: App version
  - type: input
    id: device
    attributes:
      label: Phone and Android version
