- id: crescent
  ar: اللَّهُمَّ أَهْلِلْهُ عَلَيْنَا بِالْيُمْنِ وَالإِيمَانِ وَالسَّلاَمَةِ وَالإِسْلاَمِ
    رَبِّي وَرَبُّكَ اللَّهُ
  tr: Allāhumma ahlilhu ʿalaynā bil-yumni wal-īmān, was-salāmati wal-islām. Rabbī wa rabbuka
    Allāh.
  en: O Allah, bring it over us with blessing and faith, and security and Islam. My Lord and
    your Lord is Allah
  evidence:
    - tirmidhi-3451
  source: tirmidhi-3451
- id: laylat-al-qadr
  ar: اللَّهُمَّ إِنَّكَ عَفُوٌّ كَرِيمٌ تُحِبُّ الْعَفْوَ فَاعْفُ عَنِّي
  tr: Allāhumma innaka ʿafuwwun tuḥibbu al-ʿafwa faʿfu ʿannī
  en: O Allah, indeed You are Pardoning, [Generous,] You love pardon, so pardon me
  evidence:
    - tirmidhi-3513
  source: tirmidhi-3513
- id: rain-beneficial
  ar: صَيِّبًا نَافِعًا
  tr: Allāhumma ṣayyiban nāfiʿan
  en: O Allah! Let it be a strong fruitful rain.
  evidence:
    - bukhari-1032
  source: bukhari-1032
- id: rain-stopped
  ar: مُطِرْنَا بِفَضْلِ اللَّهِ وَرَحْمَتِهِ
  tr: Muṭirnā bi-faḍlillāhi wa raḥmatih
  en: the rain was due to the Blessings and the Mercy of Allah
  evidence:
    - bukhari-846
  source: bukhari-846
- id: heavy-rain
  ar: اللَّهُمَّ حَوَالَيْنَا وَلاَ عَلَيْنَا
  tr: Allāhumma ḥawālaynā wa lā ʿalaynā
  en: O Allah! Round about us and not on us.
  evidence:
    - bukhari-1014
  source: bukhari-1014
- id: thunder
  ar: سُبْحَانَ الَّذِي ‏{‏يُسَبِّحُ الرَّعْدُ بِحَمْدِهِ وَالْمَلاَئِكَةُ مِنْ خِيفَتِهِ‏}
  tr: Subḥāna alladhī yusabbiḥu al-raʿdu bi-ḥamdihi wal-malāʾikatu min khīfatih
  en: Glory be to him whose praise the thunderclap sings and the angels glorify in awe of him
  evidence:
    - adab-723
  source: adab-723
- id: wind
  ar: اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَهَا وَخَيْرَ مَا فِيهَا وَخَيْرَ مَا أُرْسِلَتْ
    بِهِ وَأَعُوذُ بِكَ مِنْ شَرِّهَا وَشَرِّ مَا فِيهَا وَشَرِّ مَا أُرْسِلَتْ بِهِ ‏"‏
    ‏.
  tr: Allāhumma innī asʾaluka khayrahā wa khayra mā fīhā wa khayra mā ursilat bih, wa aʿūdhu
    bika min sharrihā wa sharri mā fīhā wa sharri mā ursilat bih
  en: O Allah! I ask Thee for what is good in it, and the good which it contains, and the
    good of that which it was sent for. I seek refuge with Thee from what is evil in it,
    what evil it contains, and the evil of that what it was sent for
  evidence:
    - muslim-899b
  source: muslim-899b
