- id: friday-prep
  status: published
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  tier: push
  title: Friday preparation
  short: Ghusl, siwāk, clean clothes, arrive early.
  what:
    - Ghusl, siwāk, clean clothes and, for men, fragrance. Walk if able, arrive early, and
      pray voluntary rakʿahs before the khuṭbah.
  when: Friday morning until Jumuʿah.
  pushNote: A push about 2 hours before Jumuʿah, combined with al-Kahf.
  notes:
    - Most jurists treat the ghusl as an emphasized Sunnah, and some consider it
      obligatory.
  evidence:
    - bukhari-880
    - bukhari-883
    - abudawud-345
    - tirmidhi-497
  duas: []
  occurrences:
    - on:
        weekday:
          - fri
      window:
        from:
          prayer: fajr
        to:
          prayer: jumuah
      startAnchor: morning
      endAnchor: jumuah
      countdown: jumuah
      check: done
      push:
        at:
          prayer: jumuah
          minus: 120m
        title: Friday preparation
        body: 2 hours to Jumuʿah. Ghusl, siwāk, clean clothes, arrive early.
        anchor: morning
        quiet: delay
        combined:
          title: Friday · al-Kahf and preparation
          body: Ghusl, siwāk, clean clothes, arrive early. Read al-Kahf before Maghrib.
