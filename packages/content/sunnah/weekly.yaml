- id: monthu
  status: published
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  tier: push
  title: Monday and Thursday fast
  short: Keep the voluntary fast.
  what:
    - Voluntary fast. Deeds are presented on Mondays and Thursdays, and the Prophet ﷺ
      liked to be fasting when his were presented.
  when: Every Monday and Thursday, Fajr to Maghrib. The card appears the evening before.
  pushNote: A push the evening before, after ʿIshāʾ.
  evidence:
    - tirmidhi-747
  duas: []
  occurrences:
    - key: monday
      on:
        weekday:
          - mon
      window: fast
      check: fast
      fast:
        priority: 1
        reason: habit
        also: a Monday fast
      startAnchor: from-fajr
      endAnchor: maghrib
      push:
        at:
          prayer: isha
          plus: 15m
          day: -1
        title: Tomorrow is Monday, a Sunnah fast
        body: Deeds are presented on Mondays and Thursdays.
        anchor: after-isha
        quiet: advance
      title: Monday fast
    - key: thursday
      on:
        weekday:
          - thu
      window: fast
      check: fast
      fast:
        priority: 1
        reason: habit
        also: a Thursday fast
      startAnchor: from-fajr
      endAnchor: maghrib
      push:
        at:
          prayer: isha
          plus: 15m
          day: -1
        title: Tomorrow is Thursday, a Sunnah fast
        body: Deeds are presented on Mondays and Thursdays.
        anchor: after-isha
        quiet: advance
      title: Thursday fast
- id: kahf
  status: published
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  tier: push
  title: Sūrat al-Kahf
  short: Read al-Kahf and send extra ṣalawāt.
  what:
    - Read Sūrat al-Kahf and send extra ṣalawāt on the Prophet ﷺ.
  when: Thursday Maghrib to Friday Maghrib.
  pushNote: A push on Friday morning with Friday preparation, or on its own when Friday
    preparation will not push.
  notes:
    - Al-Shāfiʿī placed al-Kahf on Friday night or day.
    - Scholars differ on the strength of the al-Kahf reports.
  evidence:
    - quran-18
    - bayhaqi-5996
    - al-umm-friday
    - abudawud-1047
  duas: []
  quran:
    label: Read al-Kahf on Quran.com
    url: https://quran.com/18
  rules:
    - combine-into-friday-push
  occurrences:
    - on:
        weekday:
          - thu
      window:
        from:
          prayer: maghrib
        to:
          prayer: maghrib
          day: 1
      startAnchor: from-maghrib
      endAnchor: maghrib
      check: done
      push:
        at:
          prayer: jumuah
          minus: 120m
          day: 1
        title: Read Sūrat al-Kahf
        body: Read it before Maghrib and send extra ṣalawāt.
        anchor: morning
        quiet: delay
