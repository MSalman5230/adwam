- id: shaban
  status: review
  month: shaban
  tier: push
  title: Shaʿbān
  short: Fast often, and make up missed Ramadan fasts.
  what:
    - Fast often. It was the month the Prophet ﷺ fasted most outside Ramadan.
    - It is also the last chance to make up missed Ramadan fasts, as ʿĀʾishah did.
  when: All of Shaʿbān, with a make-up tracker.
