- id: sacred
  status: review
  tier: inapp
  title: Sacred months
  short: Increase good deeds and guard against wrongdoing.
  what:
    - Increase good deeds and guard against wrongdoing in Muḥarram, Rajab, Dhul-Qaʿdah and
      Dhul-Ḥijjah.
  when: All of Muḥarram, Rajab, Dhul-Qaʿdah and Dhul-Ḥijjah, as a banner on Today.
