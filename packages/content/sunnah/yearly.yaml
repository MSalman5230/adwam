  tier: push
  title: Last ten nights
  short: Seek Laylat al-Qadr every night.
  what:
    - Laylat al-Qadr has started. Seek it every night until Ramadan ends.
    - Increase night prayer, wake your household, and observe iʿtikāf if able.
  when: From Maghrib on 20 Ramadan until Ramadan ends. An iʿtikāf planning card shows from
