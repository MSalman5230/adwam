- id: muslim-1342
  collection: muslim
  number: "1342"
  url: https://sunnah.com/muslim:1342
  from: prophet
  narrator: "Ibn Umar (Allah be pleased with them) reported that whenever Allah's Messenger (ﷺ)
    mounted his camel while setting out on a journey, he glorified Allah (uttered Allah-o-Akbar)
    thrice, and then said:"
  grading: []
  excerpt:
    ar: سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ وَإِنَّا إِلَى رَبِّنَا
      لَمُنْقَلِبُونَ اللَّهُمَّ إِنَّا نَسْأَلُكَ فِي سَفَرِنَا هَذَا الْبِرَّ وَالتَّقْوَى وَمِنَ
      الْعَمَلِ مَا تَرْضَى اللَّهُمَّ هَوِّنْ عَلَيْنَا سَفَرَنَا هَذَا وَاطْوِ عَنَّا بُعْدَهُ
      اللَّهُمَّ أَنْتَ الصَّاحِبُ فِي السَّفَرِ وَالْخَلِيفَةُ فِي الأَهْلِ اللَّهُمَّ إِنِّي
      أَعُوذُ بِكَ مِنْ وَعْثَاءِ السَّفَرِ وَكَآبَةِ الْمَنْظَرِ وَسُوءِ الْمُنْقَلَبِ فِي الْمَالِ
      وَالأَهْلِ ‏"‏ ‏.‏ وَإِذَا رَجَعَ قَالَهُنَّ ‏.‏ وَزَادَ فِيهِنَّ ‏"‏ آيِبُونَ تَائِبُونَ
      عَابِدُونَ لِرَبِّنَا حَامِدُونَ ‏"
    en: "Hallowed is He Who subdued for us this (ride) and we were not ourselves powerful enough to use
      It as a ride, and we are going to return to our Lord. O Allah, we seek virtue and piety from
      Thee in this journey of ours and the act which pleaseth Thee. O Allah, lighten this journey of
      ours, and make its distance easy for us. O Allah, Thou art (our) companion during the journey,
      and guardian of (our) family. O Allah, I seek refuge with Thee from hardships of the journey,
      gloominess of the sights, and finding of evil changes in property and family on return. And he
      (the Holy Prophet) uttered (these words), and made this addition to them: We are returning,
      repentant, worshipping our Lord. and praising Him."
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: muslim-1977g
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  collection: muslim
  number: 1977g
  url: https://sunnah.com/muslim:1977g
  from: prophet
  narrator: "Umm Salama, the wife of Allah's Apostle (ﷺ), reported Allah's Messenger (ﷺ) to have said:"
  grading: []
  excerpt:
    ar: مَنْ كَانَ لَهُ ذِبْحٌ يَذْبَحُهُ فَإِذَا أُهِلَّ هِلاَلُ ذِي الْحِجَّةِ فَلاَ يَأْخُذَنَّ مِنْ
      شَعْرِهِ وَلاَ مِنْ أَظْفَارِهِ شَيْئًا حَتَّى يُضَحِّيَ ‏"
    en: He who has a sacrificial animal with him whom (he intends) to offer as sacrifice, and he enters
      the month of Dhu'I-Hijja, he should not get his hair cut or nails trimmed until he has
      sacrificed the animal.
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: muslim-2018a
  collection: muslim
  number: 2018a
  url: https://sunnah.com/muslim:2018a
  from: prophet
  narrator: "Jabir b. 'Abdullah reported Allah's Messenger (ﷺ) as saying:"
  grading: []
  excerpt:
    ar: إِذَا دَخَلَ الرَّجُلُ بَيْتَهُ فَذَكَرَ اللَّهَ عِنْدَ دُخُولِهِ وَعِنْدَ طَعَامِهِ قَالَ
      الشَّيْطَانُ لاَ مَبِيتَ لَكُمْ وَلاَ عَشَاءَ ‏.‏ وَإِذَا دَخَلَ فَلَمْ يَذْكُرِ اللَّهَ
      عِنْدَ دُخُولِهِ قَالَ الشَّيْطَانُ أَدْرَكْتُمُ الْمَبِيتَ ‏.‏ وَإِذَا لَمْ يَذْكُرِ اللَّهَ
      عِنْدَ طَعَامِهِ قَالَ أَدْرَكْتُمُ الْمَبِيتَ وَالْعَشَاءَ ‏"
    en: "When a person enters his house and mentions the name of Allah at the time of entering it and
      while eating the food, Satan says (addressing himself: You have no place to spend the night
      and no evening meal; but when he enters without mentioning the name of Allah, the Satan says:
      You have found a place to spend the night, and when he does not mention the name of Allah
      while eating food, he (the Satan) says: You have found a place to spend the night and evening
      meal."
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: muslim-253b
  collection: muslim
  number: 253b
  url: https://sunnah.com/muslim:253b
  from: prophet
  narrator: "'A'isha reported:"
  grading: []
  excerpt:
    ar: دَخَلَ بَيْتَهُ بَدَأَ بِالسِّوَاكِ ‏.‏
    en: Whenever Allah's Messenger (ﷺ) entered his house, he used tooth-stick first of all.
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: muslim-853
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  collection: muslim
  number: "853"
  url: https://sunnah.com/muslim:853
  from: prophet
  narrator: "Abu Burda b. Abu Musa al-Ash'ari reported:"
  grading: []
  excerpt:
    ar: هِيَ مَا بَيْنَ أَنْ يَجْلِسَ الإِمَامُ إِلَى أَنْ تُقْضَى الصَّلاَةُ».
    en: "'Abdullah b. Umar said to me: Did you hear anything from your father narrating something from
      the messenger of Allah (ﷺ) about the time on Friday? I said: Yes, I heard him say from the
      Messenger of Allah (ﷺ) (these words):\" It is between the time when the Imam sits down and the
      end of the prayer.\""
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: muslim-879a
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  collection: muslim
  number: 879a
  url: https://sunnah.com/muslim:879a
  from: prophet
  narrator: "Ibn Abbas reported:"
  grading: []
  excerpt:
    ar: يَقْرَأُ فِي صَلاَةِ الْفَجْرِ يَوْمَ الْجُمُعَةِ ‏‏{‏ الم * تَنْزِيلُ‏}‏ السَّجْدَةُ وَ ‏‏{‏
      هَلْ أَتَى عَلَى الإِنْسَانِ حِينٌ مِنَ الدَّهْرِ‏}‏ وَأَنَّ النَّبِيَّ صلى الله عليه وسلم
      كَانَ يَقْرَأُ فِي صَلاَةِ الْجُمُعَةِ سُورَةَ الْجُمُعَةِ وَالْمُنَافِقِينَ ‏
    en: "The Apostle of Allah (ﷺ) used to recite in the morning prayer on Friday Surah\" Alif-Lam-Mim,
      Tanz'il ul-Sajda\" (Surah xxxii.): Surely there came over the man a time\" (Surah lxxvii) and
      he used to recite in Jumu'a prayer Surahs Jumu'a and al-Munafiqin."
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: muslim-881a
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  collection: muslim
  number: 881a
  url: https://sunnah.com/muslim:881a
  from: prophet
  narrator: "Abu Huraira reported Allah's Messenger (ﷺ) as saying:"
  grading: []
  excerpt:
    ar: إِذَا صَلَّى أَحَدُكُمُ الْجُمُعَةَ فَلْيُصَلِّ بَعْدَهَا أَرْبَعًا ‏"
    en: When any one of you observes the Jumu'a prayer (two obligatory rak'ahs in congregation), he
      should observe four (rak'ahs) afterwards.
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: muslim-898
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  collection: muslim
  number: "898"
  url: https://sunnah.com/muslim:898
  from: prophet
  narrator: "Anas (b. Malik) reported:"
  grading: []
  excerpt:
    ar: لِأَنَّهُ حَدِيثُ عَهْدٍ بِرَبِّهِ تَعَالَى.
    en: "It rained upon us as we were with the Messenger of Allah (ﷺ). The Messenger of Allah (way peace
      be upon him) removed his cloth (from a part of his body) till the rain fell on it. We said:
      Messenger of Allah, why did you do this? He said: It is because it (the rainfall) has just
      come from the Exalted Lord."
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: nasai-2424
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  collection: nasai
  number: "2424"
  url: https://sunnah.com/nasai:2424
  from: prophet
  narrator: "It was narrated that Musa bin Talhah said:"
  grading:
    - by: Darussalam
      grade: Hasan
  excerpt:
    ar: '"‏ إِذَا صُمْتَ شَيْئًا مِنَ الشَّهْرِ فَصُمْ ثَلاَثَ عَشْرَةَ وَأَرْبَعَ عَشْرَةَ وَخَمْسَ
      عَشْرَةَ ‏"'
    en: "\"I heard Abu Dharr, at Ar-Rabadhah, saying: 'The Messenger of Allah said: if you want to fast
      at any time during the monthm then fast on the thirteenth, fourteenth and fifteenth.\"'"
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: tirmidhi-3585
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  collection: tirmidhi
  number: "3585"
  url: https://sunnah.com/tirmidhi:3585
  from: prophet
  narrator: "`Amr bin Shu`aib narrated from his father, from his grandfather, that the Prophet (ﷺ) said:"
  grading:
    - by: Darussalam
      grade: Da’if
  excerpt:
    ar: '"‏ خَيْرُ الدُّعَاءِ دُعَاءُ يَوْمِ عَرَفَةَ وَخَيْرُ مَا قُلْتُ أَنَا وَالنَّبِيُّونَ مِنْ
      قَبْلِي لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ
      وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ ‏"'
    en: "“The best of supplication is the supplication of the Day of `Arafah. And the best of what I and
      the Prophets before me have said is: None has the right to be worshipped but Allah, Alone,
      without partner, to Him belongs all that exists, and to Him belongs the Praise, and He is
      powerful over all things. (Lā ilāha illallāh, waḥdahu lā sharīka lahu, lahul-mulku wa
      lahul-ḥamdu, wa huwa `alā kulli shai’in qadīr).’”"
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: tirmidhi-497
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  collection: tirmidhi
  number: "497"
  url: https://sunnah.com/tirmidhi:497
  from: prophet
  narrator: "Samurah bin Jundah narrated that :"
  grading:
    - by: Darussalam
      grade: Hasan
  excerpt:
    ar: '"‏ مَنْ تَوَضَّأَ يَوْمَ الْجُمُعَةِ فَبِهَا وَنِعْمَتْ وَمَنِ اغْتَسَلَ فَالْغُسْلُ أَفْضَلُ
      ‏"'
    en: "Allah's Messenger said: \"Whoever performs Wudu on Friday, then he will receive the blessing,
      and whoever performs Ghusl then Ghusl is more virtuous.\""
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: tirmidhi-530
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  collection: tirmidhi
  number: "530"
  url: https://sunnah.com/tirmidhi:530
  from: companion
  narrator: "Ali bin Abi Talib narrated:"
  grading:
    - by: Darussalam
      grade: Da'if
  excerpt:
    ar: مِنَ السُّنَّةِ أَنْ تَخْرُجَ، إِلَى الْعِيدِ مَاشِيًا وَأَنْ تَأْكُلَ شَيْئًا قَبْلَ أَنْ
      تَخْرُجَ ‏
    en: '"It is from the SUnnah to leave for the Eid walking, and to eat something before leaving."'
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: tirmidhi-542
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  collection: tirmidhi
  number: "542"
  url: https://sunnah.com/tirmidhi:542
  from: prophet
  narrator: "Abdullah bin Buraidah narrated from his father:"
  grading:
    - by: Darussalam
      grade: Hasan
  excerpt:
    ar: لاَ يَخْرُجُ يَوْمَ الْفِطْرِ حَتَّى يَطْعَمَ وَلاَ يَطْعَمُ يَوْمَ الأَضْحَى حَتَّى يُصَلِّيَ ‏
    en: '"The Prophet would not leave on the Day of Fitr until he ate, and he would not eat on the day
      of Adha until he prayed."'
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: tirmidhi-747
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  collection: tirmidhi
  number: "747"
  url: https://sunnah.com/tirmidhi:747
  from: prophet
  narrator: "Abu Hurairah narrated that:"
  grading:
    - by: Darussalam
      grade: Hasan
  excerpt:
    ar: '"‏ تُعْرَضُ الأَعْمَالُ يَوْمَ الاِثْنَيْنِ وَالْخَمِيسِ فَأُحِبُّ أَنْ يُعْرَضَ عَمَلِي
      وَأَنَا صَائِمٌ ‏"'
    en: 'the Messenger of Allah said: "Deeds are presented on Monday and Thursday, and I love that my
      deeds be presented while I am fasting."'
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: tirmidhi-807
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  collection: tirmidhi
  number: "807"
  url: https://sunnah.com/tirmidhi:807
  from: prophet
  narrator: "Zaid bin Khalid Al-Juhani narrated that:"
  grading:
    - by: Darussalam
      grade: Sahih
  excerpt:
    ar: '"‏ مَنْ فَطَّرَ صَائِمًا كَانَ لَهُ مِثْلُ أَجْرِهِ غَيْرَ أَنَّهُ لاَ يَنْقُصُ مِنْ أَجْرِ
      الصَّائِمِ شَيْئًا ‏"'
    en: "The Messenger of Allah said: \"Whoever provides the food for a fasting person to break his fast
      with, then for him is the same reward as his (the fasting person's), without anything being
      diminished from the reward of the fasting person.\""
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: urn-504320
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  collection: malik
  number: 10/2
  url: https://sunnah.com/urn/504320
  from: companion
  grading: []
  excerpt:
    ar: وَحَدَّثَنِي عَنْ مَالِكٍ، عَنْ نَافِعٍ، أَنَّ عَبْدَ اللَّهِ بْنَ عُمَرَ، كَانَ يَغْتَسِلُ
      يَوْمَ الْفِطْرِ قَبْلَ أَنْ يَغْدُوَ إِلَى الْمُصَلَّى ‏.‏
    en: Yahya related to me from Malik from Nafi that Abdullah ibn Umar used to do ghusl on the day of
      Fitr before going to the place of prayer.
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
