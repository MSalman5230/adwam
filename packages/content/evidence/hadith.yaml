- id: adab-723
  collection: adab
  number: "723"
  url: https://sunnah.com/adab:723
  from: companion
  narrator: "Abdullah bin al-Zubayr (ra) stopped speaking when he heard a thunder-clap and said:"
  grading: []
  excerpt:
    ar: سُبْحَانَ الَّذِي ‏{‏يُسَبِّحُ الرَّعْدُ بِحَمْدِهِ وَالْمَلاَئِكَةُ مِنْ خِيفَتِهِ‏}
    en: Glory be to him whose praise the thunderclap sings and the angels glorify in awe of
      him
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: muslim-899b
  collection: muslim
  number: 899b
  url: https://sunnah.com/muslim:899b
  from: prophet
  narrator: "'Ata' b. Rabah reported on the authority of 'A'isha, the wife of the Messenger
    of Allah (way peace be upon him), who said:"
  grading: []
  excerpt:
    ar: اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَهَا وَخَيْرَ مَا فِيهَا وَخَيْرَ مَا أُرْسِلَتْ
      بِهِ وَأَعُوذُ بِكَ مِنْ شَرِّهَا وَشَرِّ مَا فِيهَا وَشَرِّ مَا أُرْسِلَتْ بِهِ ‏"‏
      ‏.
    en: O Allah! I ask Thee for what is good in it, and the good which it contains, and the
      good of that which it was sent for. I seek refuge with Thee from what is evil in it,
      what evil it contains, and the evil of that what it was sent for
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
