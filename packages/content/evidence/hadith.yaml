  grading: []
  excerpt:
    ar: '"‏ مَنْ صَامَ رَمَضَانَ ثُمَّ أَتْبَعَهُ سِتًّا مِنْ شَوَّالٍ كَانَ كَصِيَامِ الدَّهْرِ ‏"'
    en: He who observed the fast of Ramadan and then followed it with six (fasts) of Shawwal. it would
      be as if he fasted perpetually.
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
