- id: tirmidhi-3451
  collection: tirmidhi
  number: "3451"
  url: https://sunnah.com/tirmidhi:3451
  from: prophet
  narrator: "Bilal bin Yahya bin Talhah bin `Ubaidullah narrated :"
  grading:
    - by: Darussalam
      grade: Da’if
  excerpt:
    ar: اللَّهُمَّ أَهْلِلْهُ عَلَيْنَا بِالْيُمْنِ وَالإِيمَانِ وَالسَّلاَمَةِ وَالإِسْلاَمِ
      رَبِّي وَرَبُّكَ اللَّهُ
    en: O Allah, bring it over us with blessing and faith, and security and Islam. My Lord and
      your Lord is Allah
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: tirmidhi-3513
  collection: tirmidhi
  number: "3513"
  url: https://sunnah.com/tirmidhi:3513
  from: prophet
  narrator: "Aishah narrated:"
  grading:
    - by: Darussalam
      grade: Sahih
  excerpt:
    ar: اللَّهُمَّ إِنَّكَ عَفُوٌّ كَرِيمٌ تُحِبُّ الْعَفْوَ فَاعْفُ عَنِّي
    en: O Allah, indeed You are Pardoning, [Generous,] You love pardon, so pardon me
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
