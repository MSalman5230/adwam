- id: ibnmajah-1388
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  collection: ibnmajah
  number: "1388"
  url: https://sunnah.com/ibnmajah:1388
  from: prophet
  narrator: "It was narrated that ‘Ali bin Abu Talib said:"
  grading:
    - by: Darussalam
      grade: Maudu’
  excerpt:
    ar: '"‏ إِذَا كَانَتْ لَيْلَةُ النِّصْفِ مِنْ شَعْبَانَ فَقُومُوا لَيْلَهَا وَصُومُوا يَوْمَهَا ‏.‏
      فَإِنَّ اللَّهَ يَنْزِلُ فِيهَا لِغُرُوبِ الشَّمْسِ إِلَى سَمَاءِ الدُّنْيَا فَيَقُولُ أَلاَ
      مِنْ مُسْتَغْفِرٍ فَأَغْفِرَ لَهُ أَلاَ مُسْتَرْزِقٌ فَأَرْزُقَهُ أَلاَ مُبْتَلًى
      فَأُعَافِيَهُ'
    en: "“The Messenger of Allah (ﷺ) said: ‘When it is the night of the middle of Sha’ban, spend its
      night in prayer and observe a fast on that day. For Allah descends at sunset on that night to
      the lowest heaven and says: ‘Is there no one who will ask Me for forgiveness, that I may
      forgive him? Is there no one who will ask Me for provision, that I may provide for him? Is
      there no one who is afflicted by trouble, that I may relieve him?’ And so on, until dawn
      comes.’”"
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: ibnmajah-1390
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  collection: ibnmajah
  number: "1390"
  url: https://sunnah.com/ibnmajah:1390
  from: prophet
  narrator: "It was narrated from Abu Musa Al-Ash’ari that the Messenger of Allah (ﷺ) said:"
  grading:
    - by: Darussalam
      grade: Da’if
  excerpt:
    ar: '"‏ إِنَّ اللَّهَ لَيَطَّلِعُ فِي لَيْلَةِ النِّصْفِ مِنْ شَعْبَانَ فَيَغْفِرُ لِجَمِيعِ
      خَلْقِهِ إِلاَّ لِمُشْرِكٍ أَوْ مُشَاحِنٍ ‏"'
    en: “Allah looks down on the night of the middle of Sha’ban and forgives all His creation, apart
      from the idolater and the Mushahin.” Another chain from Abu Musa, from the Prophet (ﷺ) with
      similar wording.
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: malik-56-26
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  collection: malik
  number: 56/26
  url: https://sunnah.com/malik/56/26
  from: successor
  grading: []
  excerpt:
    ar: حَدَّثَنِي مَالِكٌ، عَنْ عَامِرِ بْنِ عَبْدِ اللَّهِ بْنِ الزُّبَيْرِ، أَنَّهُ كَانَ إِذَا
      سَمِعَ الرَّعْدَ، تَرَكَ الْحَدِيثَ
    en: Malik related to me that Amir ibn Abdullah ibn az-Zubayr would stop speaking when he heard
      thunder and say, "Glory be to Allah whom the thunder glorifies with His praise and the angels
      from the fear of Him." (Subhana-aladhee yusabihu ar-radu bi hamdihi wa mala'ikatu min
      khiyfatihi.) Then he would say, "This is a severe warning to the people of the earth."
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: muslim-1087
  collection: muslim
  number: "1087"
  url: https://sunnah.com/muslim:1087
  from: prophet
  narrator: "Kuraib reported that Umm Fadl, daughter of Harith, sent him (Fadl, i.e. her son) to
    Mu'awiya in Syria. I (Fadl) arrived in Syria, and did the needful for her. It was there in Syria
    that the month of Ramadan commenced. I saw the new moon (of Ramadan) on Friday. I then came back
    to Medina at the end of the month. Abdullah b. 'Abbas (Allah be pleased with him) asked me
    (about the new moon of Ramadan) and said:"
  grading: []
  excerpt:
    ar: مَتَى رَأَيْتُمُ الْهِلاَلَ فَقُلْتُ رَأَيْنَاهُ لَيْلَةَ الْجُمُعَةِ ‏.‏ فَقَالَ أَنْتَ
      رَأَيْتَهُ فَقُلْتُ نَعَمْ وَرَآهُ النَّاسُ وَصَامُوا وَصَامَ مُعَاوِيَةُ ‏.‏ فَقَالَ لَكِنَّا
      رَأَيْنَاهُ لَيْلَةَ السَّبْتِ فَلاَ نَزَالُ نَصُومُ حَتَّى نُكْمِلَ ثَلاَثِينَ أَوْ نَرَاهُ
      ‏.‏ فَقُلْتُ أَوَلاَ تَكْتَفِي بِرُؤْيَةِ مُعَاوِيَةَ وَصِيَامِهِ فَقَالَ لاَ هَكَذَا
      أَمَرَنَا رَسُولُ اللَّهِ صلى الله عليه وسلم ‏.‏
    en: "When did you see it? I said: We saw it on the night of Friday. He said: (Did) you see it
      yourself? I said: Yes, and the people also saw it and they fasted and Mu'awiya also fasted,
      whereupon he said: But we saw it on Saturday night. So we will continue to fast till we
      complete thirty (fasts) or we see it (the new moon of Shawwal). I said: Is the sighting of the
      moon by Mu'awiya not valid for you? He said: No; this is how the Messenger of Allah (ﷺ) has
      commanded us. Yahya b. Yahya was in doubt (whether the word used in the narration by Kuraib)
      was Naktafi or Taktafi."
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: muslim-1134a
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  collection: muslim
  number: 1134a
  url: https://sunnah.com/muslim:1134a
  from: prophet
  narrator: "Ibn 'Abbas reported that when the Messenger of Allah (ﷺ) fasted on the day of 'Ashura and
    commanded that it should he observed as a fast, they (his Companions) said to him:"
  grading: []
  excerpt:
    ar: فَإِذَا كَانَ الْعَامُ الْمُقْبِلُ - إِنْ شَاءَ اللَّهُ - صُمْنَا الْيَوْمَ التَّاسِعَ ‏"
    en: "Messenger of Allah, it is a day which the Jews and Christians hold in high esteem. Thereupon
      the Messenger of Allah (ﷺ) said: When the next year comes, God willing, we would observe fast
      on the 9th But the Messenger of Allah (ﷺ) died before the advent of the next year."
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: muslim-1141b
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  collection: muslim
  number: 1141b
  url: https://sunnah.com/muslim:1141b
  from: prophet
  narrator: "Nabaisha reported that Khalid said:"
  grading: []
  excerpt:
    ar: حَدَّثَنَا مُحَمَّدُ بْنُ عَبْدِ اللَّهِ بْنِ نُمَيْرٍ، حَدَّثَنَا إِسْمَاعِيلُ، - يَعْنِي ابْنَ
      عُلَيَّةَ - عَنْ خَالِدٍ الْحَذَّاءِ، حَدَّثَنِي أَبُو قِلاَبَةَ، عَنْ أَبِي الْمَلِيحِ، عَنْ
      نُبَيْشَةَ، قَالَ خَالِدٌ فَلَقِيتُ أَبَا الْمَلِيحِ فَسَأَلْتُهُ فَحَدَّثَنِي بِهِ، فَذَكَرَ
      عَنِ النَّبِيِّ صلى الله عليه وسلم بِمِثْلِ حَدِيثِ هُشَيْمٍ وَزَادَ فِيهِ ‏"‏ وَذِكْرٍ
      لِلَّهِ ‏"
    en: I met Abu Malih and asked him and he narrated it to me from the Messenger of Allah (ﷺ). a hadith
      like one (narrated above) with this addition:" And remembrance of Allah"
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: muslim-1144b
  collection: muslim
  number: 1144b
  url: https://sunnah.com/muslim:1144b
  from: prophet
  narrator: "Abu Huraira (Allah be pleased with him) reported Allah's Apostle (ﷺ) as saying:"
  grading: []
  excerpt:
    ar: لاَ تَخْتَصُّوا لَيْلَةَ الْجُمُعَةِ بِقِيَامٍ مِنْ بَيْنِ اللَّيَالِي وَلاَ تَخُصُّوا يَوْمَ
      الْجُمُعَةِ بِصِيَامٍ مِنْ بَيْنِ الأَيَّامِ إِلاَّ أَنْ يَكُونَ فِي صَوْمٍ يَصُومُهُ
      أَحَدُكُمْ ‏"
    en: Do not single out the night (preceding) Friday among the nights for prayer and do not single out
      Friday among days for fasting but only when anyone among you is accustomed to fast (on dates)
      which coincide with this day (Friday).
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: muslim-1160
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  collection: muslim
  number: "1160"
  url: https://sunnah.com/muslim:1160
  from: prophet
  narrator: "Mu'adha al-'Adawiyya reported that she asked 'A'isha, the wife of the Messenger of Allah
    (ﷺ), whether the Messenger of Allah (ﷺ) observed fasts for three days during every month. She
    said:"
  grading: []
  excerpt:
    ar: لَمْ يَكُنْ يُبَالِي مِنْ أَىِّ أَيَّامِ الشَّهْرِ يَصُومُ ‏.‏
    en: "Yes I said to her: Which were (the particular) days of the month on which he observed fast? She
      said: He was not particular about the days of the month on which to observe fast."
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: muslim-1162b
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  collection: muslim
  number: 1162b
  url: https://sunnah.com/muslim:1162b
  from: prophet
  narrator: "Abu Qatada al-Ansari (Allah be pleased with him) reported that the Messenger of Allah (ﷺ)
    was asked about his fasting. The Messenger of Allah (ﷺ) felt annoyed. Thereupon 'Umar (Allah be
    pleased with him) said:"
  grading: []
  excerpt:
    ar: لاَ صَامَ وَلاَ أَفْطَرَ ‏"‏ ‏.‏ أَوْ ‏"‏ مَا صَامَ وَمَا أَفْطَرَ ‏"‏ ‏.‏ قَالَ فَسُئِلَ عَنْ
      صَوْمِ يَوْمَيْنِ وَإِفْطَارِ يَوْمٍ قَالَ ‏"‏ وَمَنْ يُطِيقُ ذَلِكَ ‏"‏ ‏.‏ قَالَ وَسُئِلَ
      عَنْ صَوْمِ يَوْمٍ وَإِفْطَارِ يَوْمَيْنِ قَالَ ‏"‏ لَيْتَ أَنَّ اللَّهَ قَوَّانَا لِذَلِكَ
      ‏"‏ ‏.‏ قَالَ وَسُئِلَ عَنْ صَوْمِ يَوْمٍ وَإِفْطَارِ يَوْمٍ قَالَ ‏"‏ ذَاكَ صَوْمُ أَخِي
      دَاوُدَ عَلَيْهِ السَّلاَمُ ‏"‏ ‏.‏ قَالَ وَسُئِلَ عَنْ صَوْمِ يَوْمِ الاِثْنَيْنِ قَالَ ‏"‏
      ذَاكَ يَوْمٌ وُلِدْتُ فِيهِ وَيَوْمٌ بُعِثْتُ أَوْ أُنْزِلَ عَلَىَّ فِيهِ ‏"‏ ‏.‏ قَالَ
      فَقَالَ ‏"‏ صَوْمُ ثَلاَثَةٍ مِنْ كُلِّ شَهْرٍ وَرَمَضَانَ إِلَى رَمَضَانَ صَوْمُ الدَّهْرِ
      ‏"‏ ‏.‏ قَالَ وَسُئِلَ عَنْ صَوْمِ يَوْمِ عَرَفَةَ فَقَالَ ‏"‏ يُكَفِّرُ السَّنَةَ
      الْمَاضِيَةَ وَالْبَاقِيَةَ ‏"‏ ‏.‏ قَالَ وَسُئِلَ عَنْ صَوْمِ يَوْمِ عَاشُورَاءَ فَقَالَ ‏"‏
      يُكَفِّرُ السَّنَةَ الْمَاضِيَةَ ‏"
    en: "We are pleased with Allah as the Lord, with Islam as our Code of Life, with Muhammad as the
      Messenger and with our pledge (to you for willing and cheerful submission) as a (sacred)
      commitment. He was then asked about perpetual fasting, whereupon he said: He neither fasted
      nor did he break it, or he did not fast and he did not break it. He was then asked about
      fasting for two days and breaking one day. He (the Holy Prophet) said: And who has strength
      enough to do it? He was asked about fasting for a day and breaking for two days, whereupon he
      said: May Allah bestow upon us strength to do it. He was then asked about fasting for a day
      and breaking on the other, whereupon he said: That is the fasting of my brother David (peace
      be upon him). He was then asked about fasting on Monday, whereupon he said: It was the day on
      which I was born. on which I was commissioned with prophethood or revelation was sent to me,
      (and he further) said: Three days' fasting every month and of the whole of Ramadan every year
      is a perpetual fast. He was asked about fasting on the day of 'Arafa (9th of Dhu'I-Hijja),
      whereupon he said: It expiates the sins of the preceding year and the coming year. He was
      asked about fasting on the day of 'Ashura (10th of Muharram), whereupon be said: It expiates
      the sins of the preceding year. (Imam Muslim said that in this hadith there is a) narration of
      Imam Shu'ba that he was asked about fasting on Monday and Thursday, but we (Imam Muslim) did
      not mention Thursday for we found it as an error (in reporting)."
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: muslim-1163a
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  collection: muslim
  number: 1163a
  url: https://sunnah.com/muslim:1163a
  from: prophet
  narrator: "Abu Haraira (Allah be pleased with him) reported Allah's Messenger (ﷺ) as saying:"
  grading: []
  excerpt:
    ar: أَفْضَلُ الصِّيَامِ بَعْدَ رَمَضَانَ شَهْرُ اللَّهِ الْمُحَرَّمُ وَأَفْضَلُ الصَّلاَةِ بَعْدَ
      الْفَرِيضَةِ صَلاَةُ اللَّيْلِ ‏"
    en: The most excellent fast after Ramadan is God's month. al-Muharram, and the most excellent prayer
      after what is prescribed is prayer during the night.
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: muslim-1164a
