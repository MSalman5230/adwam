    translator: English translation via Sunnah.com
- id: bukhari-986
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  collection: bukhari
  number: "986"
  url: https://sunnah.com/bukhari:986
  from: prophet
  narrator: "Narrated Jabir bin `Abdullah:"
  grading: []
  excerpt:
    ar: إِذَا كَانَ يَوْمُ عِيدٍ خَالَفَ الطَّرِيقَ‏.‏
