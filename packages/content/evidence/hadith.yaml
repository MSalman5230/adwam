- id: muslim-899b
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  collection: muslim
  number: 899b
  url: https://sunnah.com/muslim:899b
  from: prophet
  narrator: "'Ata' b. Rabah reported on the authority of 'A'isha, the wife of the Messenger
    of Allah (way peace be upon him), who said:"
  grading: []
  excerpt:
    ar: اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَهَا وَخَيْرَ مَا فِيهَا وَخَيْرَ مَا أُرْسِلَتْ
      بِهِ وَأَعُوذُ بِكَ مِنْ شَرِّهَا وَشَرِّ مَا فِيهَا وَشَرِّ مَا أُرْسِلَتْ بِهِ ‏"‏
      ‏.
    en: O Allah! I ask Thee for what is good in it, and the good which it contains, and the
      good of that which it was sent for. I seek refuge with Thee from what is evil in it,
      what evil it contains, and the evil of that what it was sent for
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: abudawud-1047
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  collection: abudawud
  number: "1047"
  url: https://sunnah.com/abudawud:1047
  from: prophet
  narrator: "Narrated Aws ibn Aws:"
  grading:
    - by: Al-Albani
      grade: Sahih
  excerpt:
    ar: إِنَّ مِنْ أَفْضَلِ أَيَّامِكُمْ يَوْمَ الْجُمُعَةِ فِيهِ خُلِقَ آدَمُ وَفِيهِ قُبِضَ وَفِيهِ
      النَّفْخَةُ وَفِيهِ الصَّعْقَةُ فَأَكْثِرُوا عَلَىَّ مِنَ الصَّلاَةِ فِيهِ فَإِنَّ صَلاَتَكُمْ
      مَعْرُوضَةٌ عَلَىَّ ‏"‏ ‏.‏ قَالَ قَالُوا يَا رَسُولَ اللَّهِ وَكَيْفَ تُعْرَضُ صَلاَتُنَا
      عَلَيْكَ وَقَدْ أَرِمْتَ يَقُولُونَ بَلِيتَ ‏.‏ فَقَالَ ‏"‏ إِنَّ اللَّهَ عَزَّ وَجَلَّ
      حَرَّمَ عَلَى الأَرْضِ أَجْسَادَ الأَنْبِيَاءِ ‏"
    en: "The Prophet (ﷺ) said: Among the most excellent of your days is Friday; on it Adam was created,
      on it he died, on it the last trumpet will be blown, and on it the shout will be made, so
      invoke more blessings on me that day, for your blessings will be submitted to me. The people
      asked: Messenger of Allah, how can it be that our blessings will be submitted to you while
      your body is decayed? He replied: Allah, the Exalted, has prohibited the earth from consuming
      the bodies of Prophets."
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: abudawud-1048
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  collection: abudawud
  number: "1048"
  url: https://sunnah.com/abudawud:1048
  from: prophet
  narrator: "Narrated Jabir ibn Abdullah:"
  grading:
    - by: Al-Albani
      grade: Sahih
  excerpt:
    ar: يَوْمُ الْجُمُعَةِ ثِنْتَا عَشْرَةَ ‏"‏ ‏.‏ يُرِيدُ سَاعَةً ‏"‏ لاَ يُوجَدُ مُسْلِمٌ يَسْأَلُ
      اللَّهَ عَزَّ وَجَلَّ شَيْئًا إِلاَّ آتَاهُ اللَّهُ عَزَّ وَجَلَّ فَالْتَمِسُوهَا آخِرَ
      سَاعَةٍ بَعْدَ الْعَصْرِ ‏"
    en: "The Prophet (ﷺ) said: Friday is divided into twelve hours. Amongst them there is an hour in
      which a Muslim does not ask Allah for anything but He gives it to him. So seek it in the last
      hour after the afternoon prayer."
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: abudawud-14-125
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  collection: abudawud
  number: "2437"
  url: https://sunnah.com/abudawud/14/125
  from: prophet
  narrator: "Narrated One of the wives of the Prophet:"
  grading:
    - by: Al-Albani
      grade: Sahih
  excerpt:
    ar: يَصُومُ تِسْعَ ذِي الْحِجَّةِ وَيَوْمَ عَاشُورَاءَ وَثَلاَثَةَ أَيَّامٍ مِنْ كُلِّ شَهْرٍ
      أَوَّلَ اثْنَيْنِ مِنَ الشَّهْرِ وَالْخَمِيسَ ‏.‏
    en: "Hunaydah ibn Khalid narrated from his wife on the authority of one of the wives of the Prophet
      (ﷺ) who said: The Messenger of Allah (ﷺ) used to fast the first nine days of Dhul-Hijjah,
      Ashura' and three days of every month, that is, the first Monday (of the month) and Thursday."
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: abudawud-2356
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  collection: abudawud
  number: "2356"
  url: https://sunnah.com/abudawud:2356
  from: prophet
  narrator: "Narrated Anas ibn Malik:"
  grading:
    - by: Al-Albani
      grade: Hasan Sahih
  excerpt:
    ar: يُفْطِرُ عَلَى رُطَبَاتٍ قَبْلَ أَنْ يُصَلِّيَ فَإِنْ لَمْ تَكُنْ رُطَبَاتٌ فَعَلَى تَمَرَاتٍ
      فَإِنْ لَمْ تَكُنْ حَسَا حَسَوَاتٍ مِنْ مَاءٍ ‏.‏
    en: The Messenger of Allah (ﷺ) used to break his fast before praying with some fresh dates; but if
      there were no fresh dates, he had a few dry dates, and if there were no dry dates, he took
      some mouthfuls of water.
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: abudawud-2428
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  collection: abudawud
  number: "2428"
  url: https://sunnah.com/abudawud:2428
  from: prophet
  narrator: "Narrated Abdullah ibn al-Harith ; or Uncle of Mujibah al-Bahiliyyah:"
  grading:
    - by: Al-Albani
      grade: Da'if
  excerpt:
    ar: ‏"‏ صُمْ مِنَ الْحُرُمِ وَاتْرُكْ صُمْ مِنَ الْحُرُمِ وَاتْرُكْ صُمْ مِنَ الْحُرُمِ وَاتْرُكْ
      ‏"‏ ‏.‏ وَقَالَ بِأَصَابِعِهِ الثَّلاَثَةِ فَضَمَّهَا ثُمَّ أَرْسَلَهَا
    en: >-
      The father or Uncle of Mujibah al-Bahiliyyah visited the Messenger of Allah (ﷺ). He then went
      away and came to him (again) after one year when his condition and appearance had changed.


      He said: Messenger of Allah, do you not recognize me? He asked: Who are you? He replied: I am
      al-Bahili who came to you last year. He said: What has changed you? You were looking well,
      then you were good in appearance? He said: I have only food at night since I departed from
      you.


      Thereupon the Messenger of Allah (ﷺ) said: Why did you torment yourself? Fast during Ramadan
      (the month of patience) and fast for one day every month. He said: Increase it for me, for I
      have (more) strength. He said: Fast two days. He again said: Increase it for me. He said: Fast
      three days. He again said: Increase it for me. He said: Fast during the inviolable months and
      then stop; fast during the inviolable months and then stop; fast during the inviolable months
      and then stop. He indicated by his three fingers, and joined them and then opened them.
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: abudawud-345
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  collection: abudawud
  number: "345"
  url: https://sunnah.com/abudawud:345
  from: prophet
  narrator: "Narrated Aws ibn Aws ath-Thaqafi:"
  grading:
    - by: Al-Albani
      grade: Sahih
  excerpt:
    ar: مَنْ غَسَّلَ يَوْمَ الْجُمُعَةِ وَاغْتَسَلَ ثُمَّ بَكَّرَ وَابْتَكَرَ وَمَشَى وَلَمْ يَرْكَبْ
      وَدَنَا مِنَ الإِمَامِ فَاسْتَمَعَ وَلَمْ يَلْغُ كَانَ لَهُ بِكُلِّ خُطْوَةٍ عَمَلُ سَنَةٍ
      أَجْرُ صِيَامِهَا وَقِيَامِهَا ‏"
    en: "I heard the apostle of Allah (ﷺ) say: If anyone makes (his wife) wash and he washes himself on
      Friday, goes out early (for Friday prayer), attends the sermon from the beginning, walking,
      not riding, takes his seat near the imam, listens attentively, and does not indulge in idle
      talk, he will get the reward of a year's fasting and praying at night for every step he
      takes."
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: abudawud-5094
  collection: abudawud
  number: "5094"
  url: https://sunnah.com/abudawud:5094
  from: prophet
  narrator: "Narrated Umm Salamah, Ummul Mu'minin:"
  grading:
    - by: Al-Albani
      grade: Sahih
  excerpt:
    ar: اللَّهُمَّ إِنِّي أَعُوذُ بِكَ أَنْ أَضِلَّ أَوْ أُضَلَّ أَوْ أَزِلَّ أَوْ أُزَلَّ أَوْ أَظْلِمَ
      أَوْ أُظْلَمَ أَوْ أَجْهَلَ أَوْ يُجْهَلَ عَلَىَّ ‏"
    en: 'The Messenger of Allah (ﷺ) never went out of my house without raising his eye to the sky and
      saying: "O Allah! I seek refuge in Thee lest I stray or be led astray, or slip or made to
      slip, or cause injustice, or suffer injustice, or do wrong, or have wrong done to me."'
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: abudawud-5095
  collection: abudawud
  number: "5095"
  url: https://sunnah.com/abudawud:5095
  from: prophet
  narrator: "Narrated Anas ibn Malik:"
  grading:
    - by: Al-Albani
      grade: Sahih
  excerpt:
    ar: إِذَا خَرَجَ الرَّجُلُ مِنْ بَيْتِهِ فَقَالَ بِسْمِ اللَّهِ تَوَكَّلْتُ عَلَى اللَّهِ لاَ حَوْلَ
      وَلاَ قُوَّةَ إِلاَّ بِاللَّهِ ‏"‏ ‏.‏ قَالَ ‏"‏ يُقَالُ حِينَئِذٍ هُدِيتَ وَكُفِيتَ وَوُقِيتَ
      فَتَتَنَحَّى لَهُ الشَّيَاطِينُ فَيَقُولُ لَهُ شَيْطَانٌ آخَرُ كَيْفَ لَكَ بِرَجُلٍ قَدْ
      هُدِيَ وَكُفِيَ وَوُقِيَ ‏"
    en: 'The Prophet (ﷺ) said: When a man goes out of his house and says: "In the name of Allah, I trust
      in Allah; there is no might and no power but in Allah," the following will be said to him at
      that time: "You are guided, defended and protected." The devils will go far from him and
      another devil will say: How can you deal with a man who has been guided, defended and
      protected?'
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: abudawud-5096
  collection: abudawud
  number: "5096"
  url: https://sunnah.com/abudawud:5096
  from: prophet
  narrator: "Narrated AbuMalik Al-Ash'ari:"
  grading:
    - by: Al-Albani
      grade: Da'if
  excerpt:
    ar: إِذَا وَلَجَ الرَّجُلُ فِي بَيْتِهِ فَلْيَقُلِ اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَ الْمَوْلِجِ
      وَخَيْرَ الْمَخْرَجِ بِسْمِ اللَّهِ وَلَجْنَا وَبِسْمِ اللَّهِ خَرَجْنَا وَعَلَى اللَّهِ
      رَبِّنَا تَوَكَّلْنَا ثُمَّ لْيُسَلِّمْ عَلَى أَهْلِهِ ‏"
    en: 'The Prophet (ﷺ) said: When a man goes into his house, he should say: "O Allah! I ask Thee for
      good both when entering and when going out; in the name of Allah we have entered, and in the
      name of Allah we have gone out, and in Allah our Lord do we trust." He should then greet his
      family.'
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: abudawud-5097
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  collection: abudawud
  number: "5097"
  url: https://sunnah.com/abudawud:5097
  from: prophet
  narrator: "Narrated AbuHurayrah:"
  grading:
    - by: Al-Albani
      grade: Sahih
  excerpt:
    ar: الرِّيحُ مِنْ رَوْحِ اللَّهِ ‏"‏ ‏.‏ قَالَ سَلَمَةُ فَرَوْحُ اللَّهِ تَأْتِي بِالرَّحْمَةِ
      وَتَأْتِي بِالْعَذَابِ فَإِذَا رَأَيْتُمُوهَا فَلاَ تَسُبُّوهَا وَسَلُوا اللَّهَ خَيْرَهَا
      وَاسْتَعِيذُوا بِاللَّهِ مِنْ شَرِّهَا ‏"
    en: >-
      I heard the Messenger of Allah (ﷺ) say: The wind comes from Allah's mercy.


      Salamah's version has: It is Allah's mercy; it (sometimes) brings blessing and (sometimes)
      brings punishment. So when you see it, do not revile it, but ask Allah for some of its good,
      and seek refuge in Allah from its evil.
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: abudawud-5099
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  collection: abudawud
  number: "5099"
  url: https://sunnah.com/abudawud:5099
  from: prophet
  narrator: "Narrated Aisha, Ummul Mu'minin (mother of the believers):"
  grading:
    - by: Al-Albani
      grade: Sahih
  excerpt:
    ar: إِذَا رَأَى نَاشِئًا فِي أُفُقِ السَّمَاءِ تَرَكَ الْعَمَلَ وَإِنْ كَانَ فِي صَلاَةٍ ثُمَّ
      يَقُولُ ‏"‏ اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ شَرِّهَا ‏"‏ ‏.‏ فَإِنْ مُطِرَ قَالَ ‏"‏
      اللَّهُمَّ صَيِّبًا هَنِيئًا ‏"
    en: 'When the Prophet (ﷺ) saw a cloud formation in the sky, he would stop what he was doing, even if
      he were in prayer, and then would say: "O Allah! I seek refuge in You from its evil. "If it
      rained, he would say: "O Allah! send a beneficial downpour."'
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: bukhari-1044
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  collection: bukhari
  number: "1044"
  url: https://sunnah.com/bukhari:1044
  from: prophet
  narrator: "Narrated `Aisha:"
  grading: []
  excerpt:
    ar: إِنَّ الشَّمْسَ وَالْقَمَرَ آيَتَانِ مِنْ آيَاتِ اللَّهِ، لاَ يَنْخَسِفَانِ لِمَوْتِ أَحَدٍ
      وَلاَ لِحَيَاتِهِ، فَإِذَا رَأَيْتُمْ ذَلِكَ فَادْعُوا اللَّهَ وَكَبِّرُوا، وَصَلُّوا
      وَتَصَدَّقُوا ‏"‏‏.‏ ثُمَّ قَالَ ‏"‏ يَا أُمَّةَ مُحَمَّدٍ، وَاللَّهِ مَا مِنْ أَحَدٍ أَغْيَرُ
      مِنَ اللَّهِ أَنْ يَزْنِيَ عَبْدُهُ أَوْ تَزْنِيَ أَمَتُهُ، يَا أُمَّةَ مُحَمَّدٍ، وَاللَّهِ
      لَوْ تَعْلَمُونَ مَا أَعْلَمُ لَضَحِكْتُمْ قَلِيلاً وَلَبَكَيْتُمْ كَثِيرًا ‏"
    en: In the lifetime of Allah's Messenger (ﷺ) (p.b.u.h) the sun eclipsed, so he led the people in
      prayer, and stood up and performed a long Qiyam, then bowed for a long while. He stood up
      again and performed a long Qiyam but this time the period of standing was shorter than the
      first. He bowed again for a long time but shorter than the first one, then he prostrated and
      prolonged the prostration. He did the same in the second rak`a as he did in the first and then
      finished the prayer; by then the sun (eclipse) had cleared. He delivered the Khutba (sermon)
      and after praising and glorifying Allah he said, "The sun and the moon are two signs against
      the signs of Allah; they do not eclipse on the death or life of anyone. So when you see the
      eclipse, remember Allah and say Takbir, pray and give Sadaqa." The Prophet then said, "O
      followers of Muhammad! By Allah! There is none who has more ghaira (selfrespect) than Allah as
      He has forbidden that His slaves, male or female commit adultery (illegal sexual intercourse).
      O followers of Muhammad! By Allah! If you knew that which I know you would laugh little and
      weep much.
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: bukhari-13-18
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  collection: bukhari
  number: "969"
  url: https://sunnah.com/bukhari/13/18
  from: prophet
  narrator: "Narrated Ibn `Abbas:"
  grading: []
  excerpt:
    ar: مَا الْعَمَلُ فِي أَيَّامِ الْعَشْرِ أَفْضَلَ مِنَ الْعَمَلِ فِي هَذِهِ ‏"‏‏.‏ قَالُوا وَلاَ
      الْجِهَادُ قَالَ ‏"‏ وَلاَ الْجِهَادُ، إِلاَّ رَجُلٌ خَرَجَ يُخَاطِرُ بِنَفْسِهِ وَمَالِهِ
      فَلَمْ يَرْجِعْ بِشَىْءٍ ‏"
    en: The Prophet (ﷺ) said, "No good deeds done on other days are superior to those done on these
      (first ten days of Dhul Hijja)." Then some companions of the Prophet (ﷺ) said, "Not even
      Jihad?" He replied, "Not even Jihad, except that of a man who does it by putting himself and
      his property in danger (for Allah's sake) and does not return with any of those things."
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: bukhari-1503
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  collection: bukhari
  number: "1503"
  url: https://sunnah.com/bukhari:1503
  from: prophet
  narrator: "Narrated Ibn `Umar:"
  grading: []
  excerpt:
    ar: فَرَضَ رَسُولُ اللَّهِ صلى الله عليه وسلم زَكَاةَ الْفِطْرِ صَاعًا مِنْ تَمْرٍ، أَوْ صَاعًا مِنْ
      شَعِيرٍ عَلَى الْعَبْدِ وَالْحُرِّ، وَالذَّكَرِ وَالأُنْثَى، وَالصَّغِيرِ وَالْكَبِيرِ مِنَ
      الْمُسْلِمِينَ، وَأَمَرَ بِهَا أَنْ تُؤَدَّى قَبْلَ خُرُوجِ النَّاسِ إِلَى الصَّلاَةِ‏.‏
    en: Allah's Messenger (ﷺ) enjoined the payment of one Sa' of dates or one Sa' of barley as
      Zakat-ul-Fitr on every Muslim slave or free, male or female, young or old, and he ordered that
      it be paid before the people went out to offer the `Id prayer. (One Sa' = 3 Kilograms approx.)
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: bukhari-1909
  collection: bukhari
  number: "1909"
  url: https://sunnah.com/bukhari:1909
  from: prophet
  narrator: "Narrated Abu Huraira:"
  grading: []
  excerpt:
    ar: صُومُوا لِرُؤْيَتِهِ، وَأَفْطِرُوا لِرُؤْيَتِهِ، فَإِنْ غُبِّيَ عَلَيْكُمْ فَأَكْمِلُوا عِدَّةَ
      شَعْبَانَ ثَلاَثِينَ ‏"
    en: The Prophet (ﷺ) or Abul-Qasim said, "Start fasting on seeing the crescent (of Ramadan), and give
      up fasting on seeing the crescent (of Shawwal), and if the sky is overcast (and you cannot see
      it), complete thirty days of Sha'ban."
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: bukhari-1914
  collection: bukhari
  number: "1914"
  url: https://sunnah.com/bukhari:1914
  from: prophet
  narrator: "Narrated Abu Huraira:"
  grading: []
  excerpt:
    ar: لاَ يَتَقَدَّمَنَّ أَحَدُكُمْ رَمَضَانَ بِصَوْمِ يَوْمٍ أَوْ يَوْمَيْنِ، إِلاَّ أَنْ يَكُونَ
      رَجُلٌ كَانَ يَصُومُ صَوْمَهُ فَلْيَصُمْ ذَلِكَ الْيَوْمَ ‏"
    en: The Prophet (ﷺ) said, "None of you should fast a day or two before the month of Ramadan unless
      he has the habit of fasting (Nawafil) (and if his fasting coincides with that day) then he can
      fast that day."
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: bukhari-1923
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  collection: bukhari
  number: "1923"
  url: https://sunnah.com/bukhari:1923
  from: prophet
  narrator: "Narrated Anas bin Malik:"
