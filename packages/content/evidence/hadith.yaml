    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: bukhari-2024
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  collection: bukhari
  number: "2024"
  url: https://sunnah.com/bukhari:2024
  from: prophet
  narrator: "Narrated Aisha:"
  grading: []
  excerpt:
    ar: إِذَا دَخَلَ الْعَشْرُ شَدَّ مِئْزَرَهُ، وَأَحْيَا لَيْلَهُ، وَأَيْقَظَ أَهْلَهُ‏.‏
    en: With the start of the last ten days of Ramadan, the Prophet (ﷺ) used to tighten his waist belt
      (i.e. work hard) and used to pray all the night, and used to keep his family awake for the
      prayers.
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: bukhari-2026
