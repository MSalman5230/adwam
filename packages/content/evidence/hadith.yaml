    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: bukhari-2021
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  collection: bukhari
  number: "2021"
  url: https://sunnah.com/bukhari:2021
  from: prophet
  narrator: "Narrated Ibn `Abbas:"
  grading: []
  excerpt:
    ar: الْتَمِسُوهَا فِي الْعَشْرِ الأَوَاخِرِ مِنْ رَمَضَانَ لَيْلَةَ الْقَدْرِ فِي تَاسِعَةٍ تَبْقَى،
      فِي سَابِعَةٍ تَبْقَى، فِي خَامِسَةٍ تَبْقَى ‏"
    en: The Prophet (ﷺ) said, "Look for the Night of Qadr in the last ten nights of Ramadan ,' on the
      night when nine or seven or five nights remain out of the last ten nights of Ramadan (i.e. 21,
      23, 25, respectively).
