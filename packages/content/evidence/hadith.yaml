- id: bukhari-1988
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  collection: bukhari
  number: "1988"
  url: https://sunnah.com/bukhari:1988
  from: prophet
  narrator: "Narrated Um Al-Fadl bint Al-Harith:"
  grading: []
  excerpt:
    ar: نَاسًا تَمَارَوْا عِنْدَهَا يَوْمَ عَرَفَةَ فِي صَوْمِ النَّبِيِّ صلى الله عليه وسلم فَقَالَ
      بَعْضُهُمْ هُوَ صَائِمٌ‏.‏ وَقَالَ بَعْضُهُمْ لَيْسَ بِصَائِمٍ‏.‏ فَأَرْسَلَتْ إِلَيْهِ
      بِقَدَحِ لَبَنٍ وَهْوَ وَاقِفٌ عَلَى بَعِيرِهِ فَشَرِبَهُ‏.‏
    en: '"While the people were with me on the day of `Arafat they differed as to whether the Prophet
      (ﷺ) was fasting or not; some said that he was fasting while others said that he was not
      fasting. So, I sent to him a bowl full of milk while he was riding over his camel and he drank
      it."'
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: bukhari-1990
  collection: bukhari
  number: "1990"
  url: https://sunnah.com/bukhari:1990
  from: prophet
  narrator: "Narrated Abu `Ubaid:"
  grading: []
  excerpt:
    ar: شَهِدْتُ الْعِيدَ مَعَ عُمَرَ بْنِ الْخَطَّابِ ـ رضى الله عنه ـ فَقَالَ هَذَانِ يَوْمَانِ نَهَى
      رَسُولُ اللَّهِ صلى الله عليه وسلم عَنْ صِيَامِهِمَا يَوْمُ فِطْرِكُمْ مِنْ صِيَامِكُمْ،
      وَالْيَوْمُ الآخَرُ تَأْكُلُونَ فِيهِ مِنْ نُسُكِكُمْ‏.‏
    en: (the slave of Ibn Azhar) I witnessed the `Id with `Umar bin Al-Khattab who said, Allah's
      Messenger (ﷺ) has forbidden people to fast on the day on which you break fasting (the fasts of
      Ramadan) and the day on which you eat the meat of your sacrifices (the first day of `Id ul
      Fitr and `Id ul-Adha).
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: bukhari-2017
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  collection: bukhari
  number: "2017"
  url: https://sunnah.com/bukhari:2017
  from: prophet
  narrator: "Narrated `Aisha:"
  grading: []
  excerpt:
    ar: تَحَرَّوْا لَيْلَةَ الْقَدْرِ فِي الْوِتْرِ مِنَ الْعَشْرِ الأَوَاخِرِ مِنْ رَمَضَانَ ‏"
