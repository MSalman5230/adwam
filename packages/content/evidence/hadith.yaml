- id: bukhari-1969
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  collection: bukhari
  number: "1969"
  url: https://sunnah.com/bukhari:1969
  from: prophet
  narrator: "Narrated `Aisha:"
  grading: []
  excerpt:
    ar: يَصُومُ حَتَّى نَقُولَ لاَ يُفْطِرُ، وَيُفْطِرُ حَتَّى نَقُولَ لاَ يَصُومُ‏.‏ فَمَا رَأَيْتُ
      رَسُولَ اللَّهِ صلى الله عليه وسلم اسْتَكْمَلَ صِيَامَ شَهْرٍ إِلاَّ رَمَضَانَ، وَمَا
      رَأَيْتُهُ أَكْثَرَ صِيَامًا مِنْهُ فِي شَعْبَانَ‏.‏
    en: Allah's Messenger (ﷺ) used to fast till one would say that he would never stop fasting, and he
      would abandon fasting till one would say that he would never fast. I never saw Allah's
      Messenger (ﷺ) fasting for a whole month except the month of Ramadan, and did not see him
      fasting in any month more than in the month of Sha'ban.
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: bukhari-1985
  collection: bukhari
  number: "1985"
  url: https://sunnah.com/bukhari:1985
  from: prophet
  narrator: "Narrated Abu Huraira:"
  grading: []
  excerpt:
    ar: لاَ يَصُومَنَّ أَحَدُكُمْ يَوْمَ الْجُمُعَةِ، إِلاَّ يَوْمًا قَبْلَهُ أَوْ بَعْدَهُ ‏"
    en: I heard the Prophet (ﷺ) saying, "None of you should fast on Friday unless he fasts a day before
