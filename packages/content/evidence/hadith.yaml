- id: bukhari-880
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  collection: bukhari
  number: "880"
  url: https://sunnah.com/bukhari:880
  from: prophet
  narrator: "Narrated Abu Sa`id:"
  grading: []
  excerpt:
    ar: الْغُسْلُ يَوْمَ الْجُمُعَةِ وَاجِبٌ عَلَى كُلِّ مُحْتَلِمٍ، وَأَنْ يَسْتَنَّ وَأَنْ يَمَسَّ
      طِيبًا إِنْ وَجَدَ ‏"
    en: I testify that Allah's Messenger (ﷺ) said, "The taking of a bath on Friday is compulsory for
      every male Muslim who has attained the age of puberty and (also) the cleaning of his teeth
      with Siwak, and the using of perfume if it is available." `Amr (a sub-narrator) said, "I
      confirm that the taking of a bath is compulsory, but as for the Siwak and the using of
      perfume, Allah knows better whether it is obligatory or not, but according to the Hadith it is
      as above.")
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: bukhari-883
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  collection: bukhari
  number: "883"
  url: https://sunnah.com/bukhari:883
  from: prophet
  narrator: "Narrated Salman-Al-Farsi:"
  grading: []
  excerpt:
    ar: لاَ يَغْتَسِلُ رَجُلٌ يَوْمَ الْجُمُعَةِ، وَيَتَطَهَّرُ مَا اسْتَطَاعَ مِنْ طُهْرٍ، وَيَدَّهِنُ
      مِنْ دُهْنِهِ، أَوْ يَمَسُّ مِنْ طِيبِ بَيْتِهِ ثُمَّ يَخْرُجُ، فَلاَ يُفَرِّقُ بَيْنَ
      اثْنَيْنِ، ثُمَّ يُصَلِّي مَا كُتِبَ لَهُ، ثُمَّ يُنْصِتُ إِذَا تَكَلَّمَ الإِمَامُ، إِلاَّ
      غُفِرَ لَهُ مَا بَيْنَهُ وَبَيْنَ الْجُمُعَةِ الأُخْرَى ‏"
    en: The Prophet (p.b.u.h) said, "Whoever takes a bath on Friday, purifies himself as much as he can,
      then uses his (hair) oil or perfumes himself with the scent of his house, then proceeds (for
      the Jumua prayer) and does not separate two persons sitting together (in the mosque), then
      prays as much as (Allah has) written for him and then remains silent while the Imam is
      delivering the Khutba, his sins in-between the present and the last Friday would be forgiven."
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: bukhari-937
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  collection: bukhari
  number: "937"
  url: https://sunnah.com/bukhari:937
  from: prophet
  narrator: "Narrated `Abdullah bin `Umar:"
  grading: []
  excerpt:
    ar: يُصَلِّي قَبْلَ الظُّهْرِ رَكْعَتَيْنِ، وَبَعْدَهَا رَكْعَتَيْنِ، وَبَعْدَ الْمَغْرِبِ
      رَكْعَتَيْنِ فِي بَيْتِهِ، وَبَعْدَ الْعِشَاءِ رَكْعَتَيْنِ وَكَانَ لاَ يُصَلِّي بَعْدَ
      الْجُمُعَةِ حَتَّى يَنْصَرِفَ فَيُصَلِّي رَكْعَتَيْنِ‏.‏
    en: Allah's Messenger (ﷺ) used to pray two rak`at before the Zuhr prayer and two rak`at after it. He
      also used to pray two rak`at after the Maghrib prayer in his house, and two rak`at after the
      `Isha' prayer. He never prayed after Jumua prayer till he departed (from the Mosque), and then
      he would pray two rak`at at home.
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: bukhari-953
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  collection: bukhari
  number: "953"
  url: https://sunnah.com/bukhari:953
  from: prophet
  narrator: "Narrated Anas bin Malik:"
  grading: []
  excerpt:
    ar: لاَ يَغْدُو يَوْمَ الْفِطْرِ حَتَّى يَأْكُلَ تَمَرَاتٍ‏.‏
    en: "Allah's Messenger (ﷺ) never proceeded (for the prayer) on the Day of `Id-ul-Fitr unless he had
      eaten some dates. Anas also narrated: The Prophet (ﷺ) used to eat odd number of dates."
    partial: true
  textSource:
