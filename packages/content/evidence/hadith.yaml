- id: bukhari-5546
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  collection: bukhari
  number: "5546"
  url: https://sunnah.com/bukhari:5546
  from: prophet
  narrator: "Narrated Anas bin Malik:"
  grading: []
  excerpt:
    ar: مَنْ ذَبَحَ قَبْلَ الصَّلاَةِ فَإِنَّمَا ذَبَحَ لِنَفْسِهِ، وَمَنْ ذَبَحَ بَعْدَ الصَّلاَةِ
      فَقَدْ تَمَّ نُسُكُهُ، وَأَصَابَ سُنَّةَ الْمُسْلِمِينَ ‏"
    en: The Prophet (ﷺ) said, "Whoever slaughtered the sacrifice before the prayer, he just slaughtered
      it for himself, and whoever slaughtered it after the prayer, he slaughtered it at the right
      time and followed the tradition of the Muslims."
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: bukhari-5569
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  collection: bukhari
  number: "5569"
  url: https://sunnah.com/bukhari:5569
  from: prophet
  narrator: "Narrated Salama bin Al-Aqua':"
  grading: []
  excerpt:
    ar: مَنْ ضَحَّى مِنْكُمْ فَلاَ يُصْبِحَنَّ بَعْدَ ثَالِثَةٍ وَفِي بَيْتِهِ مِنْهُ شَىْءٌ ‏"‏‏.‏
      فَلَمَّا كَانَ الْعَامُ الْمُقْبِلُ قَالُوا يَا رَسُولَ اللَّهِ نَفْعَلُ كَمَا فَعَلْنَا عَامَ
      الْمَاضِي قَالَ ‏"‏ كُلُوا وَأَطْعِمُوا وَادَّخِرُوا فَإِنَّ ذَلِكَ الْعَامَ كَانَ بِالنَّاسِ
      جَهْدٌ فَأَرَدْتُ أَنْ تُعِينُوا فِيهَا ‏"
    en: The Prophet (ﷺ) said, "Whoever has slaughtered a sacrifice should not keep anything of Its meat
      after three days." When it was the next year the people said, "O Allah's Messenger (ﷺ)! Shall
      we do as we did last year?" He said, ' Eat of it and feed of it to others and store of it for
      in that year the people were having a hard time and I wanted you to help (the needy).
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: bukhari-6
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  collection: bukhari
  number: "6"
  url: https://sunnah.com/bukhari:6
  from: prophet
  narrator: "Narrated Ibn 'Abbas:"
  grading: []
  excerpt:
    ar: أَجْوَدَ النَّاسِ، وَكَانَ أَجْوَدُ مَا يَكُونُ فِي رَمَضَانَ حِينَ يَلْقَاهُ جِبْرِيلُ، وَكَانَ
      يَلْقَاهُ فِي كُلِّ لَيْلَةٍ مِنْ رَمَضَانَ فَيُدَارِسُهُ الْقُرْآنَ، فَلَرَسُولُ اللَّهِ صلى
      الله عليه وسلم أَجْوَدُ بِالْخَيْرِ مِنَ الرِّيحِ الْمُرْسَلَةِ‏.‏
    en: Allah's Messenger (ﷺ) was the most generous of all the people, and he used to reach the peak in
      generosity in the month of Ramadan when Gabriel met him. Gabriel used to meet him every night
      of Ramadan to teach him the Qur'an. Allah's Messenger (ﷺ) was the most generous person, even
      more generous than the strong uncontrollable wind (in readiness and haste to do charitable
      deeds).
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
