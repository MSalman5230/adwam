- id: bukhari-1950
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  collection: bukhari
  number: "1950"
  url: https://sunnah.com/bukhari:1950
  from: companion
  narrator: "Narrated `Aisha:"
  grading: []
  excerpt:
    ar: كَانَ يَكُونُ عَلَىَّ الصَّوْمُ مِنْ رَمَضَانَ، فَمَا أَسْتَطِيعُ أَنْ أَقْضِيَ إِلاَّ فِي
      شَعْبَانَ‏.‏
    en: Sometimes I missed some days of Ramadan, but could not fast in lieu of them except in the month
      of Sha'ban." Said Yahya, a sub-narrator, "She used to be busy serving the Prophet (ﷺ) ."
    partial: true
  textSource:
    site: sunnah.com
    fetched: 2026-11-21
    translator: English translation via Sunnah.com
- id: bukhari-1957
  reviewed: { by: MSalman5230, on: 2026-11-22 }
  collection: bukhari
  number: "1957"
  url: https://sunnah.com/bukhari:1957
  from: prophet
  narrator: "Narrated Sahl bin Sa`d:"
  grading: []
  excerpt:
    ar: لاَ يَزَالُ النَّاسُ بِخَيْرٍ مَا عَجَّلُوا الْفِطْرَ ‏"
    en: Allah's Messenger (ﷺ) said, "The people will remain on the right path as long as they hasten the
      breaking of the fast."
